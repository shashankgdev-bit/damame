[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "damame-py"
version = "0.1.0"
description = "Session-over-session analytics for damame exports — AI coding-session data as pandas DataFrames"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shashank G" }]
dependencies = ["pandas>=1.5"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/damame_py"]
