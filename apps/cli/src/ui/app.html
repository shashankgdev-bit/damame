  const openIssues = items.filter((it) => !it.dismissed && !fixed.has(it.rule_id));
  const unusedSkills = (d.inventory?.skills || []).filter((x) => !x.used);
  const phases = (d.phases || []).length;
  const agents = (d.agents || []).filter((a) => !a.on_abandoned_branch).length;

  const navcard = (href, title, sent, count, zeroLabel) => `
    <a class="navcard" href="${href}">
      <span class="nc-body"><span class="nc-title">${esc(title)}</span><span class="nc-sent">${esc(sent)}</span></span>
      <span class="nc-count${count > 0 ? "" : " zero"}">${count > 0 ? count : (zeroLabel || "✓")}</span>
      <span class="nc-arrow">→</span>
    </a>`;

  const issueSent = openIssues.length
    ? `top: ${headlineFor(openIssues[0]).slice(0, 76)}`
    : "nothing flagged — a clean session (not proof of perfection)";

  $("view").innerHTML = `
    ${sessionHero(d)}
    ${statsBand(d)}
    <div class="navcards">
      ${navcard(`#${sid}/issues`, "Issues & fixes", issueSent, openIssues.length)}
      ${navcard(`#${sid}/activity`, "How the work flowed", `${phases} phases · ${f_count(d)} tool calls · ${agents} delegations`, 0, "view")}
      ${navcard(`#${sid}/quality`, "Helpers available", unusedSkills.length ? `${unusedSkills.length} skill${unusedSkills.length === 1 ? "" : "s"} sat unused this session — see what they do` : "every available helper that mattered was used", unusedSkills.length)}
    </div>
    <a class="navcard aboutcard" href="#${sid}/about">
      <span class="nc-body"><span class="nc-title">How damame works</span><span class="nc-sent">The pipeline, every detector, and each one's evidence from this session</span></span>
      <span class="nc-arrow">→</span>
    </a>
    <div class="homefoot"><a href="#${sid}/score">score breakdown</a> · <a href="#library">recipe library</a></div>
    <div class="grading">grading: damame ${esc(d.grading.damame_version)} · ${esc(d.grading.score_version || "")} · ir ${esc(d.grading.ir_version)} · adapter ${esc(d.grading.adapter)}@${esc(d.grading.adapter_version)} · ${Object.keys(d.grading.rule_versions).length} rules — reports are comparable only when these match</div>`;

  fetchBrief(d.meta.id);
  fetchRecs(d.meta.id, []);
}
function f_count(d) { return (d.facts.tool_call_count || 0).toLocaleString(); }

/* ————— fixed-state: which issues the user has marked resolved.
   Per-session, in localStorage — survives refresh for a clean demo. The
   real fix agent (Phase 3) will apply the change AND record it here. ————— */
function fixedKey(sid) { return `damame-fixed-${sid}`; }
function getFixed(sid) {
  try { return new Set(JSON.parse(localStorage.getItem(fixedKey(sid)) || "[]")); } catch { return new Set(); }
}
function setFixedRule(sid, ruleId, on) {
  const s = getFixed(sid);
  if (on) s.add(ruleId); else s.delete(ruleId);
  try { localStorage.setItem(fixedKey(sid), JSON.stringify([...s])); } catch { /* private mode */ }
}

// The audit runs as a server-side background job; the UI polls status so a
// multi-minute run survives navigation, browser fetch timeouts, and other
// tabs. The button is re-queried every update — a stale reference after a
// re-render would write completion state into a detached node.
let auditPoll = null;
function setAuditLabel(text, disabled) {
  const b = $("auditbtn");
  if (b) { b.textContent = text; b.disabled = !!disabled; }
}
function pollAudit(sid) {
  if (auditPoll) clearInterval(auditPoll);
  auditPoll = setInterval(async () => {
    try {
      const st = await api(`/api/session/${sid}/audit/status`);
      if (st.running) { setAuditLabel("auditing… (safe to keep browsing)", true); return; }
      clearInterval(auditPoll); auditPoll = null;
      if (st.error) { setAuditLabel("audit failed — " + st.error, false); return; }
      if (st.result) {
        setAuditLabel(`done — ${st.result.records} verdicts, honeypots ${st.result.honeypots_caught}/${st.result.honeypots_total}`, false);
        // Refresh only if the user is still looking at this session — never
        // yank a different page out from under them.
        if ((location.hash || "").slice(1).startsWith(sid.slice(0, 8))) setTimeout(() => location.reload(), 900);
      } else {
        setAuditLabel("Get a second opinion", false);
      }
    } catch { /* transient poll failure — try again next tick */ }
  }, 4000);
}
async function runAudit(sid) {
  const idle = "Get a second opinion";
  let started = false;
  try {
    setAuditLabel("estimating…", true);
    const est = await api(`/api/session/${sid}/audit/estimate`);
    if (!est.cli_available) {
      setAuditLabel(idle, false);
      alert("claude CLI not found — the audit runs through your own claude login.");
      return;
    }
    if (!est.findings) { setAuditLabel("nothing to audit — no findings", true); return; }
    if (est.running) { setAuditLabel("auditing… (started elsewhere)", true); pollAudit(sid); return; }
    const ok = confirm(
      `Second opinion on ${est.findings} findings\n` +
      `+ ${est.honeypots} hidden honeypots × ${est.runs} runs\n` +
      `estimated ${Math.round(est.est_tokens / 1000)}k–${Math.round((est.est_tokens_high || est.est_tokens) / 1000)}k input tokens ` +
      `on YOUR claude account (a floor — CLI overhead per call is extra).\n\nProceed?`);
    if (!ok) { setAuditLabel(idle, false); return; }
    started = true;
    progressStart();
    setAuditLabel("starting…", true);
    const r = await fetch(`/api/session/${sid}/audit`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ keys: est.finding_keys || [] }),
    });
    const out = await r.json();
    if (!r.ok && !out.already_running) throw new Error(out.error || "audit failed to start");
    pollAudit(sid);
  } catch (e) {
    setAuditLabel("audit failed — see terminal", false);
    alert(String(e.message || e));
  } finally {
    // progressStart only ran after consent; an unmatched progressDone would
    // hide the shared top bar while other requests are still in flight.
    if (started) progressDone();
  }
}

function obsBlock(d, it) {
  const turns = [...new Set(it.findings.flatMap((f) => f.turn_indexes || []))].slice(0, 6).map((t) => t + 1);
  const concepts = (RULE_CONCEPTS[it.rule_id] || []).map((g) =>
    `<button class="pchip agent" data-g="${esc(g)}" data-gx="background for this observation">learn: ${esc(g.replace("concept:", ""))}</button>`).join(" ");
  return `
    <div class="obs">
      <div class="obs-head">${esc(headlineFor(it))}${cost(it) ? ` <span class="tag measured">${esc(cost(it))}</span>` : ""}</div>
      <div class="rc-text">${esc(it.why)}</div>
      <div class="obs-meta">${turns.length ? `seen around turn${turns.length === 1 ? "" : "s"} ${turns.join(", ")} · ` : ""}${it.findings.length} instance${it.findings.length === 1 ? "" : "s"} ${concepts}</div>
      ${recipeBody(it.entry)}
      <details class="evidence"><summary>show the ${it.findings.length === 1 ? "instance" : it.findings.length + " instances"} (evidence)</summary>
        ${it.findings.map(findingCard).join("")}
      </details>
    </div>`;
}

/** Which rules are one-click auto-fixable, and where the fix lands. */
function fixableMap(d) {
  const m = new Map();
  for (const x of (d.surfaces?.fixes || [])) m.set(x.rule_id, x.destination);
  return m;
}

function renderIssues(d) {
  const sid = d.meta.id.slice(0, 8);
  const fixable = fixableMap(d);
  const fixed = getFixed(sid);
  const items = (state.items || []).filter((it) => !it.dismissed);
  const open = items.filter((it) => !fixed.has(it.rule_id));
  const done = items.filter((it) => fixed.has(it.rule_id));
  const notYours = d.surfaces?.not_yours || [];

  const sevOf = (it) => it.sev >= 3 ? "major" : it.sev === 2 ? "moderate" : it.sev === 1 ? "minor" : "info";
  const issueRow = (it) => {
    const canFix = fixable.has(it.rule_id);
    return `
    <button class="issue-row sev-${sevOf(it)}" data-issue="${esc(it.rule_id)}">
      <span class="idot" aria-hidden="true"></span>
      <span class="iname"><b>${esc(headlineFor(it))}</b><span class="imeta">${it.findings.length} instance${it.findings.length === 1 ? "" : "s"}${cost(it) ? ` · ${esc(cost(it))}` : ""}</span></span>
      <span class="ibadge ${canFix ? "fix" : "coach"}">${canFix ? "auto-fixable" : "you decide"}</span>
      <span class="iarrow">→</span>
    </button>`;
  };
  const fixedRow = (it) => {
    const canFix = fixable.has(it.rule_id);
    return `
    <div class="fixed-row">
      <span class="fcheck" aria-hidden="true">✓</span>
      <span class="fname">${esc(headlineFor(it))}<em>${canFix ? esc(fixable.get(it.rule_id)) : "marked as handled"}</em></span>
      <button class="fundo" data-undo="${esc(it.rule_id)}">undo</button>
    </div>`;
  };

  $("view").innerHTML = `${sessionHeader(d, true)}
    <div class="section">
      <h2 class="eyebrow">Issues found${open.length ? ` — ${open.length}` : ""}</h2>
      <div class="gloss">Everything damame flagged in this session, most important first. Open one for what happened, the evidence, and a fix. Auto-fixable items apply in one click; the rest show you what to change. Fixed items drop to the bottom.</div>
      <div class="issues-wrap">
        ${open.length ? open.map(issueRow).join("") : '<div class="empty"><b>All clear here.</b> No open issues — either a clean session or everything\'s been handled below.</div>'}
      </div>
      ${done.length ? `<div class="fixed-head">✓ Fixed (${done.length})</div><div class="fixed-sub">Applied or handled this session. The fix agent will later verify each one actually stopped recurring.</div>${done.map(fixedRow).join("")}` : ""}
      ${notYours.length ? `
      <div class="coolroom">
        <h3>Not your inefficiency</h3>
        ${notYours.map((x) => `<div class="cool-row"><span>${esc(x.headline)}</span><span class="lg-proof">${esc(x.proof)}</span></div>`).join("")}
        <div class="cool-note">provider-side — never counted in your score, nothing to fix.</div>
      </div>` : ""}
      <div class="auditbar" id="auditbar">
        <button id="auditbtn">Get a second opinion</button>
        <span>an LLM cross-examines each finding against its evidence — runs on your own claude account, verdicts stay local</span>
      </div>
      <div class="grading">grading: damame ${esc(d.grading.damame_version)} · ${esc(d.grading.score_version || "")} · ${Object.keys(d.grading.rule_versions).length} rules · <a href="#${sid}/score">how the score works →</a></div>
    </div>`;

  // wire: open dialog per issue, undo per fixed row, audit
  const byRule = new Map((state.items || []).map((it) => [it.rule_id, it]));
  $("view").querySelectorAll("[data-issue]").forEach((el) => {
    el.onclick = () => openIssue(d, byRule.get(el.getAttribute("data-issue")));
  });
  $("view").querySelectorAll("[data-undo]").forEach((el) => {
    el.onclick = () => { setFixedRule(sid, el.getAttribute("data-undo"), false); renderIssues(d); };
  });
  const ab = $("auditbtn");
  if (ab) ab.onclick = () => runAudit(sid);
}

function openIssue(d, it) {
  if (!it) return;
  const sid = d.meta.id.slice(0, 8);
  const canFix = fixableMap(d).has(it.rule_id);
  const dest = fixableMap(d).get(it.rule_id);
  $("recModal").innerHTML = `
    <button class="m-close" data-close-modal aria-label="Close dialog">✕</button>
    <div class="m-head" id="recModalHead">${esc(headlineFor(it))}</div>
    <div class="rc-label">what happened in this chat</div>
    <div class="rc-text">${esc(it.why)}</div>
    ${recipeBody(it.entry)}
    <div class="rc-instances"><button class="navbtn" style="display:inline;width:auto;padding:4px 12px" data-instances>show the ${it.findings.length === 1 ? "instance" : it.findings.length + " instances"} (evidence) ▾</button></div>
    <div class="m-instances"></div>
    <button class="m-fixbtn ${canFix ? "" : "coach"}" data-fix>${canFix ? `Apply fix → ${esc(dest)}` : "Mark as handled"}</button>
    <div class="m-fixnote">${canFix ? "Adds the hook/setting for you (mocked in this build; the fix agent will apply and verify it)." : "This one is a habit change, not a file edit — marking it handled moves it to Fixed so you can track it."}</div>`;
  $("modalBack").classList.add("open");
  $("recModal").querySelector("[data-close-modal]").onclick = () => $("modalBack").classList.remove("open");
  const instBtn = $("recModal").querySelector("[data-instances]");
  instBtn.onclick = () => {
    const area = $("recModal").querySelector(".m-instances");
    if (area.innerHTML) { area.innerHTML = ""; instBtn.textContent = `show the ${it.findings.length === 1 ? "instance" : it.findings.length + " instances"} (evidence) ▾`; return; }
    area.innerHTML = it.findings.map(findingCard).join("");
    instBtn.textContent = "hide instances ▴";
    wireFindings(state.data);
  };
  $("recModal").querySelector("[data-fix]").onclick = () => {
    setFixedRule(sid, it.rule_id, true);
    $("modalBack").classList.remove("open");
    renderIssues(d);
  };
}

/* The About page: the pipeline in one line, then every detector as a card
   showing whether it fired in THIS session and — on click — the evidence
   (where + how) via the same finding cards used everywhere else. */
const CAT_LABELS = {
  "error-loop": "Error loops", "context-hygiene": "Context hygiene", "redundant-work": "Redundant work",
  "missed-resource": "Missed capabilities", "delegation": "Missed capabilities", "prompting": "Prompting & recovery",
  "interaction-friction": "Interaction friction", "infra": "Not your inefficiency (infrastructure)",
};
/* Plain-language "what it is" + "how damame detects it" per detector — the
   mechanism, in words a newcomer can follow. Shown from the ⓘ button. */
const HOW_DETECTED = {
  "edit-fail-loop": { what: "Claude got stuck retrying a file edit that kept failing — guessing at the old text instead of re-reading the file.", how: "Fires on 3+ consecutive failed Edit results on the same file (major at 5). A diagnostic read in between does not break the streak — only a successful edit on that file does." },
  "cache-thrash": { what: "The prompt cache missed, so a big chunk of the conversation was re-billed at full price instead of the ~10% cached rate.", how: "Reads the API's own cache-miss counts, groups the missed input tokens by reason, and fires at 100k missed tokens (major at 1M). Provider-side reasons are marked infrastructure and never counted against you." },
  "duplicate-tool-call": { what: "The exact same tool call ran again and produced byte-identical output, with nothing changed in between — pure repeat.", how: "Requires identical input fingerprint AND identical output fingerprint AND no state-changing attempt between the two (and not across a compaction — that belongs to compaction-rework). Fires at 3+ repeats or 20k repeated bytes." },
  "compaction-burn": { what: "The conversation was summarized to fit the context window repeatedly — and each summary silently drops detail.", how: "Counts compaction events in the live conversation; fires at 2+ (major at 4)." },
  "compaction-rework": { what: "After a compaction, content the chat had already loaded got re-read — the summary kept the file names but not the file contents.", how: "Pairs a read after a compaction with a read before it that has the SAME input fingerprint AND a byte-identical output — so 'nothing changed' is proven, not guessed. Fires at 3+ re-reads or 20k re-purchased bytes per compaction." },
  "permission-churn": { what: "You repeatedly denied Claude's permission prompts — a sign the setup fights your actual workflow.", how: "Counts permission-denial events (the user-rejected signature); fires at 3+." },
  "bash-error-loop": { what: "The same terminal command failed again and again — usually because Claude lacked one fact only you had.", how: "Fires on 3+ consecutive failures of the same command (nonzero exit or timeout); major at 5." },
  "abandoned-work": { what: "A large amount of built work was thrown away when you rewound the conversation — the direction check came too late.", how: "Sums the tokens on a branch discarded by a rewind (a fork made within one sitting); fires at 200k (major at 1M). Branches orphaned by a session resume are NOT your action and are filed as infrastructure." },
  "missed-delegation": { what: "A long run of file reading happened in the main conversation while a subagent that could have done it in its own context sat unused.", how: "Fires on 15+ consecutive read-only calls in a single turn while an Explore-type agent was recorded available in that session's own environment — upgraded if a compaction happened in the same turn (proof the reading blew the context)." },
  "oversized-context-reads": { what: "A whole large file was read end-to-end to answer a narrow question — swallowing the whale to taste a fin.", how: "Fires on a full-file read (no offset/limit) whose result is 80KB or larger. Savings are modeled — the finding states the assumption." },
  "retry-storm": { what: "Transient API errors and auto-retries — the provider's weather, not anything you did.", how: "Fires on 3+ transient API errors. Always informational, category infrastructure, and structurally excluded from your score — it exists so provider delay is never blamed on you." },
  "paste-relay": { what: "You worked as the data courier — pasting the same-shaped block by hand over and over, when Claude could fetch the source itself.", how: "Fires on 6+ human-entered blocks of 600+ bytes that share a normalized shape (numbers masked), totaling 15KB+. Same shape repeated means a template — and a template can be fetched by a machine." },
  "repeated-delegation": { what: "The same task was re-improvised as a fresh subagent spawn many times, each retelling drifting a little.", how: "Normalizes every spawn's description into a task family (lowercase, digits→#, first three words) and fires at 5+ spawns in one family (major at 15). Claims no token savings — the cost is drift, which has no honest token number." },
  "eternal-session": { what: "One chat used as a permanent workspace for weeks — every morning re-buys a giant, repeatedly-summarized context.", how: "A triple gate, all three required: 15+ resumes AND 3+ compactions AND a 7+ day span. Each alone is innocent; only the combination is the pattern." },
  "idle-gap-notifications": { what: "Finished work repeatedly sat waiting because nothing announced it was done.", how: "Fires on 5+ gaps of 5+ minutes (summing to 30min+) between a turn finishing and your next prompt. Gaps over 2 hours or crossing a session boundary (nights) are excluded, and sessions that schedule their own wake-ups are suppressed entirely." },
  "post-edit-ritual": { what: "The same command follows your edits again and again — a habit a hook could run for you automatically.", how: "Fires when the same normalized command follows a file edit 10+ times. The threshold was calibrated on real sessions: habitual families ran 10–48 times while incidental commands stayed at 6 or below, so 10 sits in the measured gap." },
};
async function renderAbout(d) {
  const sid = d.meta.id.slice(0, 8);
  $("view").innerHTML = `${sessionHeader(d, true)}<div class="loading">reading the detector catalog…</div>`;
  let rules = state._rules;
  if (!rules) { try { rules = state._rules = await api("/api/rules"); } catch { rules = []; } }
  if (state.currentId !== d.meta.id) return; // navigated away while fetching

  const byRule = new Map();
  for (const f of d.findings) {
    const g = byRule.get(f.rule.id) || [];
    g.push(f);
    byRule.set(f.rule.id, g);
  }
  const sevRank = { major: 3, moderate: 2, minor: 1, info: 0 };
  const worstSev = (fs) => fs.reduce((w, f) => (sevRank[f.severity] > sevRank[w] ? f.severity : w), "info");

  // group detectors by their display category, fired-first within each
  const groups = new Map();
  for (const r of rules) {
    const label = CAT_LABELS[r.category] || r.category;
    (groups.get(label) || groups.set(label, []).get(label)).push(r);
  }
  const firedCount = rules.filter((r) => byRule.has(r.id)).length;

  const detCard = (r) => {
    const fs = byRule.get(r.id);
    const sev = fs ? worstSev(fs) : null;
    const status = fs
      ? `<span class="det-status fired ${sev}">detected ${fs.length}×</span>`
      : `<span class="det-status clean">not here</span>`;
    return `
    <div class="det-card">
      <div class="det-top" data-det="${esc(r.id)}" role="button" tabindex="0" aria-expanded="false">
        <span class="det-name">${esc(r.id)}</span><span class="det-ver">v${esc(r.version)}</span>
        <span class="det-what">${esc(r.summary)}</span>
        ${status}
        <button class="det-info" data-info="${esc(r.id)}" title="what this is & how it's detected" aria-label="what ${esc(r.id)} detects and how">i</button>
        <span class="det-caret">▾</span>
      </div>
      <div class="det-ev" data-ev="${esc(r.id)}" hidden></div>
    </div>`;
  };

  $("view").innerHTML = `${sessionHeader(d, true)}
    <div class="section">
      <h2 class="eyebrow">How damame works</h2>
      <div class="pipeline">
        <div class="flow">
          <span class="step">parse</span><span class="arr">→</span>
          <span class="step">metrics</span><span class="arr">→</span>
          <span class="step">${rules.length} detectors</span><span class="arr">→</span>
          <span class="step">score</span><span class="arr">→</span>
          <span class="step">optional LLM audit</span>
        </div>
        <div class="evalline">A streaming transcript becomes typed events, one pure pass computes the metrics, ${rules.length} deterministic detectors read them (same session in → same findings out), and a published-formula score summarizes the result. The detectors are graded against manufactured ground truth — <b>recall 1.00 / precision 1.00 over 540 planted-defect sessions</b>. In this session, <b>${firedCount} of ${rules.length}</b> detectors fired.</div>
        <div style="margin-top:14px"><a class="wn-act" href="#eval">See the ground-truth eval — run it live →</a></div>
      </div>
      ${[...groups.entries()].map(([label, rs]) => `
        <div class="det-cat-head">${esc(label)}</div>
        ${rs.map(detCard).join("")}`).join("")}
    </div>`;

  const rulesById = new Map(rules.map((r) => [r.id, r]));
  $("view").querySelectorAll("[data-det]").forEach((row) => {
    const toggle = () => {
      const id = row.getAttribute("data-det");
      const ev = $("view").querySelector(`[data-ev="${CSS.escape(id)}"]`);
      if (!ev.hidden) { ev.hidden = true; ev.innerHTML = ""; row.setAttribute("aria-expanded", "false"); return; }
      const fs = byRule.get(id);
      ev.innerHTML = fs
        ? `<div class="det-defn">Detected in this session — here is exactly where and how, with a link to the transcript line for each instance:</div>${fs.map(findingCard).join("")}`
        : `<div class="det-clean">This detector did not fire in this session — no matching pattern crossed its threshold. That is a fact about this session, not proof of perfection.</div>`;
      ev.hidden = false;
      row.setAttribute("aria-expanded", "true");
      if (fs) wireFindings(d);
    };
    row.onclick = toggle;
    row.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
  });
  $("view").querySelectorAll("[data-info]").forEach((btn) => {
    btn.onclick = (e) => { e.stopPropagation(); openDetectorInfo(btn.getAttribute("data-info"), rulesById); };
  });
}

async function fetchRecs(id, tags) {
  let pb = { matches: [] };
  let stats = null;
  try {
    [pb, stats] = await Promise.all([
      api("/api/session/" + id + "/playbooks?tags=" + encodeURIComponent(tags.join(","))),
      api("/api/feedback/stats").catch(() => null),
    ]);
  } catch { /* recs render without playbook/stats context */ }
  if (state.currentId !== id) return;
  state.pbMatch = (pb.matches || [])[0] || null;
  state.recurrence = Object.fromEntries(((stats && stats.recurrence) || []).map((r) => [r.rule_id, r]));
  state.items = buildRecItems(state.data, state.pbMatch, state.recurrence);
  if ($("recs")) renderRecs(state.data, state.pbMatch, state.recurrence);
}

function buildRecItems(d, match, recurrence) {
  const items = new Map();
  const SEV = { major: 3, moderate: 2, minor: 1, info: 0 };
  for (const f of d.findings) {
    if (f.category === "infra") continue;
    if (state.noActionRefs.includes(f.recommendation.resource.ref)) continue;
    let it = items.get(f.rule.id);
    if (!it) {
      it = { rule_id: f.rule.id, findings: [], tokens: 0, ms: 0, sev: 0, res: f.recommendation.resource, rationale: f.recommendation.rationale, pb: null };
      items.set(f.rule.id, it);
    }
    it.findings.push(f);
    it.tokens += f.savings?.tokens?.value || 0;
    it.ms += f.savings?.wall_clock_ms?.value || 0;
    it.sev = Math.max(it.sev, SEV[f.severity] ?? 0);
  }
  if (match) {
    for (const e of match.evidenced) {
      const it = items.get(e.entry.evidence.rule_id);
      if (it) { it.pb = e.entry; it.playbook_name = match.playbook_name; }
    }
  }
  const out = [...items.values()];
  for (const it of out) {
    it.entry = registryEntryFor(it.res.kind, it.res.ref);
    it.title = it.pb ? it.pb.title : (it.entry ? it.entry.title : it.res.ref);
    it.why = it.pb ? `${it.pb.mistake} Instead: ${it.pb.fix}` : it.rationale;
    it.dismissed = it.findings.length > 0 && it.findings.every((f) => f.feedback && f.feedback.applicable === false);
    const rec = recurrence[it.rule_id];
    it.improving = !!(rec && rec.verdict === "improving" && rec.rate_before > 0 && rec.rate_after <= rec.rate_before * 0.5);
  }
  // Severity first (it encodes judged importance even when a rule honestly
  // claims no token savings), measured cost as the tiebreak.
  out.sort((a, b) => (b.sev - a.sev) || (b.tokens - a.tokens) || (b.ms - a.ms));
  return out;
}

function renderRecs(d, match, recurrence) {
  const all = buildRecItems(d, match, recurrence);
  $("sec-recs").style.display = "";
  if (!all.length) {
    $("recs-eyebrow").textContent = "What to do next";
    $("recs-gloss").textContent = "";
    $("recs").innerHTML = `<div class="empty"><b>No rule fired.</b> No conservative detector found unambiguous waste in this session. It does not mean the session was flawless.</div>`;
    return;
  }
  const active = all.filter((it) => !it.dismissed && !it.improving);
  const dismissed = all.filter((it) => it.dismissed);
  const improving = all.filter((it) => !it.dismissed && it.improving);
  $("recs-eyebrow").textContent = `What to do next${active.length > 3 ? " — top 3" : ""}`;
  $("recs-gloss").innerHTML = `Ranked by measured cost in this session. Only patterns evidenced in your own transcript appear here${match ? ` <i style="color:var(--ink-3)">· playbook: ${esc(match.playbook_name)}</i>` : ""}. Mark one ✗ and it stays gone.`;

  const card = (it) => `
    <div class="recrow" data-open-rec="${esc(it.rule_id)}" role="button" tabindex="0">
      <span class="rc-head">${esc(headlineFor(it))}</span>
      ${cost(it) ? `<span class="tag measured">${esc(cost(it))}</span>` : ""}
      <button class="fb-dismiss" data-dismiss="${esc(it.rule_id)}" title="not relevant to my situation — hide this permanently">✗ not relevant</button>
    </div>`;

  const openRecModal = (it) => {
    $("recModal").innerHTML = `
      <button class="m-close" data-close-modal aria-label="Close dialog">✕</button>
      <div class="m-head" id="recModalHead">${esc(headlineFor(it))}</div>
      <div class="rc-label">what's happening in this chat</div>
      <div class="rc-text">${esc(it.why)}</div>
      ${recipeBody(it.entry)}
      <div class="rc-instances"><button class="navbtn" style="display:inline;width:auto;padding:4px 12px" data-instances>show the ${it.findings.length === 1 ? "instance" : it.findings.length + " instances"} ▾</button></div>
      <div class="m-instances"></div>`;
    $("modalBack").classList.add("open");
    $("recModal").querySelector("[data-close-modal]").onclick = () => $("modalBack").classList.remove("open");
    const instBtn = $("recModal").querySelector("[data-instances]");
    instBtn.onclick = () => {
      const area = $("recModal").querySelector(".m-instances");
      if (area.innerHTML) {
        area.innerHTML = "";
        instBtn.textContent = `show the ${it.findings.length === 1 ? "instance" : it.findings.length + " instances"} ▾`;
        return;
      }
      area.innerHTML = it.findings.map(findingCard).join("");
      instBtn.textContent = "hide instances ▴";
      wireFindings(state.data); // feedback buttons + hover work inside the dialog too
    };
  };

  const top = active.slice(0, 3);
  const rest = active.slice(3);
  $("recs").innerHTML =
    top.map(card).join("") +
    (rest.length ? `<details style="margin-top:6px"><summary style="cursor:pointer;color:var(--ink-3);font:11px var(--mono)">▸ ${rest.length} more (lower measured cost)</summary>${rest.map(card).join("")}</details>` : "") +
    (improving.length ? `<details style="margin-top:6px"><summary style="cursor:pointer;color:var(--pod-deep);font:11px var(--mono)">▸ improving — ${improving.length} pattern${improving.length === 1 ? "" : "s"} shrinking since damame first flagged them</summary>
      ${improving.map((it) => `<div class="rec" style="border-left-color:var(--pod)"><div class="h">${esc(it.title)}</div><div class="t">The pattern's frequency has dropped by half or more across your recent sessions — whatever you changed is working.</div></div>`).join("")}</details>` : "") +
    (dismissed.length ? `<details style="margin-top:6px"><summary style="cursor:pointer;color:var(--ink-3);font:11px var(--mono)">▸ dismissed by you (${dismissed.length})</summary>
      ${dismissed.map((it) => `<div class="rec" style="border-left-color:var(--hair)"><div class="h">${esc(it.title)} <button class="fb-dismiss" data-undismiss="${esc(it.rule_id)}">undo</button></div></div>`).join("")}</details>` : "") +
    (match && match.unevidenced.length ? `<details style="margin-top:6px"><summary style="cursor:pointer;color:var(--ink-3);font:11px var(--mono)">▸ more in the ${esc(match.playbook_name)} playbook (${match.unevidenced.length} — not evidenced in this session, reference only)</summary>
      ${match.unevidenced.map((e) => `<div class="rec" style="border-left-color:var(--hair)"><div class="h">${esc(e.title)}</div><div class="t">${esc(e.fix)}</div></div>`).join("")}</details>` : "");

  for (const row of document.querySelectorAll("[data-open-rec]")) {
    const it = all.find((x) => x.rule_id === row.dataset.openRec);
    if (!it) continue;
    row.onclick = () => openRecModal(it);
    row.onkeydown = (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openRecModal(it); } };
  }
  const setApplicable = async (ruleId, answer) => {
    const it = all.find((x) => x.rule_id === ruleId);
    if (!it) return;
    for (const f of it.findings) {
      try {
        await api("/api/feedback", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ key: f.dedupe_key, question: "applicable", answer }) });
        f.feedback = f.feedback || {}; f.feedback.applicable = answer;
      } catch { /* keep going; partial recording is still progress */ }
    }
    renderRecs(d, match, recurrence);
  };
  for (const btn of document.querySelectorAll("[data-dismiss]")) btn.onclick = (ev) => { ev.preventDefault(); ev.stopPropagation(); setApplicable(btn.dataset.dismiss, false); };
  for (const btn of document.querySelectorAll("[data-undismiss]")) btn.onclick = (ev) => { ev.preventDefault(); ev.stopPropagation(); setApplicable(btn.dataset.undismiss, true); };
}

async function fetchBrief(id) {
  const box = $("briefbox");
  if (!box) return;
  let b;
  try { b = await api("/api/session/" + id + "/brief"); }
  catch (e) { b = { status: "error", reason: e.message }; }
  if (state.currentId !== id) return; // user moved on
  state.briefTags = b.status === "ready" ? (b.brief.use_case_tags || []) : [];
  fetchRecs(id, state.briefTags);
  if (!$("briefbox")) return; // brief box only exists on the home page
  if (b.status !== "ready") {
    $("briefbox").innerHTML = `<span class="muted">no story brief — ${esc(b.reason || "unavailable")}</span>`;
    return;
  }
  const refTexts = Object.fromEntries((b.digest?.items ?? []).map((i) => [i.id, i.text]));
  const claim = (c) => `${esc(c.text)}<button class="cite" data-cite="${esc(c.refs.map((r) => refTexts[r] || r).join("\n\n"))}" aria-label="show the evidence behind this claim">◦</button>`;
  const section = (label, claims) => claims.length
    ? `<div class="blabel">${label}</div><ul>${claims.map((c) => `<li>${claim(c)}</li>`).join("")}</ul>`
    : `<div class="blabel">${label}</div><div class="muted">all claims here failed the citation check and were removed</div>`;
  $("briefbox").innerHTML = `
    ${b.brief.what_this_was.length
      ? `<div class="big">${b.brief.what_this_was.map(claim).join(" ")}</div>`
      : `<div class="muted">the brief's headline failed the citation check — the grounded details below survive</div>`}
    <div class="tagrow">${b.brief.use_case_tags.map((t) => `<span class="tagchip">${esc(t)}</span>`).join("")}</div>
    ${(b.brief.story || []).length ? `<div class="story">${b.brief.story.map((s, i) => `
      <div class="beat"><span class="bnum">${i + 1}</span>
        <details>
          <summary>${esc(s.one_liner)}</summary>
          <div class="bdepth">${esc(s.detail)}
            <div class="brow">
              ${s.capability && s.capability !== "none" ? `<button class="pchip agent" data-g="cap:${esc(s.capability)}" data-gx="the mechanism behind this part of the story">how: ${esc(s.capability.replace(/-/g, " "))}</button>` : ""}
              <button class="pchip" data-cite="${esc(s.refs.map((r) => refTexts[r] || r).join("\n\n"))}">evidence ◦</button>
            </div>
          </div>
        </details>
      </div>`).join("")}</div>` : ""}
    ${b.degraded ? `<div class="bwarn">caution: ${b.dropped_claims} claim(s) failed the citation check and were removed</div>` : ""}
    <details>
      <summary>the working pattern, and how this brief is grounded</summary>
      ${section("how it was worked", b.brief.working_pattern)}
      ${section("how claude worked it", b.brief.how_claude_worked)}
      <div class="bnote">generated locally via your claude login (${esc(b.model)}, ${esc(b.prompt_version)}) from a structured digest — every claim cites measured items (click ◦); nothing leaves this machine except the digest to your own Claude session</div>
    </details>`;
}

/* ————— click-to-learn glossary: every chip teaches what the thing IS ————— */
const GLOSSARY = {
  Read: ["tool", "Opens a file and pulls its contents into the conversation so Claude can see it."],
  Edit: ["tool", "Changes a file by replacing an exact snippet of text with a new one."],
  Write: ["tool", "Creates a new file, or replaces a file's entire contents."],
  Bash: ["tool", "Runs a terminal command on your machine — builds, tests, git, installs, anything you could type in a shell."],
  Grep: ["tool", "Searches inside files for a text pattern — how Claude finds where something lives in a codebase."],
  Glob: ["tool", "Finds files by name pattern (like *.ts) without opening them."],
  LS: ["tool", "Lists what's inside a folder."],
  WebSearch: ["tool", "Searches the web and reads the results."],
  WebFetch: ["tool", "Fetches a specific web page and reads it."],
  TodoWrite: ["tool", "Claude's own to-do list — how it plans multi-step work and tracks what's done."],
  AskUserQuestion: ["tool", "Asks you a structured question with options when a decision is genuinely yours to make."],
  Task: ["tool", "Spawns a subagent — a separate helper Claude with a fresh, empty memory that does one bounded job and returns only its result. Keeps bulk work out of this conversation."],
  Agent: ["tool", "Spawns a subagent — a separate helper Claude with a fresh, empty memory that does one bounded job and returns only its result. Keeps bulk work out of this conversation."],
  Workflow: ["tool", "A small program Claude writes to run many subagents in a planned sequence — fan out, collect, verify — with the steps guaranteed by a script instead of improvised."],
  ToolSearch: ["tool", "Loads extra tools on demand instead of carrying them all from the start."],
  ScheduleWakeup: ["tool", "Schedules Claude to wake itself up later and continue working — how overnight/autonomous loops run."],
  NotebookEdit: ["tool", "Edits a Jupyter notebook cell."],
  SendUserFile: ["tool", "Sends a file to you directly."],
  Monitor: ["tool", "Waits for a condition (a file, a process) before continuing."],
  "concept:errors": ["what happened", "Tool calls that failed — a command exited with an error, an edit didn't match. Claude reads the error and usually retries differently; repeated identical failures are what the findings below flag."],
  "concept:compaction": ["what happened", "The conversation grew past the model's working-memory limit, so it was paused and summarized — older detail was replaced by a short summary. Costs a pause and loses nuance; damame counts every one."],
  "concept:agents": ["concept", "Subagents are helper Claudes spawned for bounded tasks. Each works in its own separate context and returns only its result — the main conversation never sees its raw work."],
  "concept:caching": ["concept", "Every message re-sends the whole conversation, so the provider saves the computed state of your chat's earlier part (the prompt cache) and re-serves it at ~10% of full price — but only if those earlier bytes are IDENTICAL. Adding a tool/MCP mid-session, switching models, or rewriting history changes the bytes, so the whole conversation gets re-processed at full price. That's a cache miss."],
  "concept:hooks": ["concept", "A hook is a reflex wired into Claude Code: 'whenever X happens, run this command automatically' — e.g. run the tests after every file edit. Once installed in settings, it can never be forgotten, unlike an instruction in the chat."],
  "cap:agentic-loop": ["how it worked", "The core cycle: Claude writes or runs something, reads the real result (output, error, test failure), and adjusts — looping without a human between steps. This is what 'Claude Code' fundamentally is."],
  "cap:subagents": ["how it worked", "Claude delegated to helper Claudes — each born with a fresh, empty memory, doing one bounded job, returning only its result. Keeps heavy work out of this conversation's memory."],
  "cap:workflows": ["how it worked", "Claude wrote a small program that ran many helpers in a planned sequence — fanning out, collecting, verifying — with the steps guaranteed by code instead of improvised."],
  "cap:state-files": ["how it worked", "Durable knowledge was kept in project files (ledgers, plans, CLAUDE.md) instead of the conversation — so it survived every memory limit and every new session."],
  "cap:scheduling": ["how it worked", "Claude scheduled its own wake-ups (or cron jobs) to keep working unattended — overnight runs with a written plan and a morning report."],
  "cap:compaction": ["what happened", "The conversation hit the model's working-memory limit and was summarized to continue — older detail became a short summary. A cost, not a feature; the fix is keeping bulk work out of the main chat."],
  "cap:web-access": ["how it worked", "Claude searched or fetched from the web to bring outside information into the session."],
  "cap:none": ["note", "Plain conversation — no special machinery in this beat."],
};
function glossFor(key) {
  if (Object.hasOwn(GLOSSARY, key)) return { title: key.replace(/^concept:/, ""), kind: GLOSSARY[key][0], body: GLOSSARY[key][1] };
  if (/^mcp__/.test(key)) {
    const parts = key.split("__");
    return { title: parts[2] || key, kind: "connected tool", body: `A tool provided by the "${parts[1] || "?"}" MCP server — an external capability you (or the harness) plugged into Claude for this session.` };
  }
  if (key.startsWith("agent:")) {
    const type = key.slice(6);
    const known = {
      Explore: "A read-only scout: it searches and reads across many files so the main conversation doesn't have to hold all that text. It can look but never change anything.",
      Plan: "An architect helper: reads code and designs an implementation plan, without editing anything.",
      "general-purpose": "A do-anything helper for bounded multi-step jobs — research, refactors, searches — that returns a summary.",
      workflow: "A step inside a scripted workflow run — one worker in a planned fan-out.",
    };
    return { title: type, kind: "subagent", body: (known[type] || "A helper Claude spawned for a bounded task.") + " Subagents start with a fresh, empty memory and return only their result — their raw work never enters this conversation." };
  }
  return { title: key, kind: "tool", body: "One of the actions Claude can take. Every use and failure of it is counted in the Tools section below." };
}
function showPop(anchor, title, kind, body, extra) {
  const pop = $("infoPop");
  pop.innerHTML = `<div class="it">${esc(title)}<span class="ik">${esc(kind)}</span></div><div class="ib">${esc(body)}</div>${extra ? `<div class="ix">${esc(extra)}</div>` : ""}`;
  pop.style.display = "block";
  const r = anchor.getBoundingClientRect();
  const w = Math.min(320, innerWidth - 24);
  pop.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 12)) + "px";
  // Measure the real height; flip above the anchor when it doesn't fit below.
  pop.style.top = "0px";
  const h = pop.offsetHeight;
  let top = r.bottom + 8;
  if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 8);
  pop.style.top = top + "px";
}
function showInfo(anchor, key, extra) {
  const g = glossFor(key);
  showPop(anchor, g.title, g.kind, g.body, extra);
}
const hidePop = () => { $("infoPop").style.display = "none"; };
document.addEventListener("click", (e) => {
  const chip = e.target.closest("[data-g]");
  if (chip) { showInfo(chip, chip.dataset.g, chip.dataset.gx || ""); e.stopPropagation(); return; }
  const cite = e.target.closest("[data-cite]");
  if (cite) { showPop(cite, "evidence", "cited digest items", cite.dataset.cite, "the brief may only claim what these measured items support"); e.stopPropagation(); return; }
  if (!e.target.closest("#infoPop")) hidePop();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { hidePop(); $("modalBack").classList.remove("open"); } });
document.addEventListener("scroll", hidePop, true);
$("modalBack").addEventListener("click", (e) => { if (e.target === $("modalBack")) $("modalBack").classList.remove("open"); });

/* The activity vocabulary: label → [plain gloss, dot color]. Text always
   carries the meaning; color is reinforcement, never the only signal. */
const PHASE_META = {
  exploring: ["reading & searching", "var(--minor)"],
  building: ["writing & editing files", "var(--pod)"],
  verifying: ["running commands & tests", "var(--moderate)"],
  debugging: ["hitting errors & fixing them", "var(--major)"],
  delegating: ["sending out agents", "var(--pod-deep)"],
  planning: ["organizing the work", "var(--info)"],
  discussing: ["conversation — no tools", "var(--bar)"],
};

function turnRow(t) {
  const toolStr = (t.tools || []).slice(0, 4).map(([n, k]) => `${esc(n)}${k > 1 ? "×" + k : ""}`).join(" · ");
  const bits = [];
  if (t.calls) bits.push(`<span>${t.calls} call${t.calls === 1 ? "" : "s"}${toolStr ? " — " + toolStr : ""}</span>`);
  if ((t.agents || []).length) bits.push(`<span class="agent">agents: ${esc([...new Set(t.agents)].join(", "))}</span>`);
  if (t.errors) bits.push(`<span class="err">${t.errors} error${t.errors === 1 ? "" : "s"}</span>`);
  if (t.interrupted) bits.push(`<span class="err">interrupted</span>`);
  if (t.tokens) bits.push(`<span>${fmtTok(t.tokens)} tok</span>`);
  if (t.wall_ms) bits.push(`<span>${fmtMs(t.wall_ms)}</span>`);
  for (const cd of t.compactions || []) {
    bits.push(`<span style="color:var(--moderate)">context compacted${cd && cd.pre ? `: ${fmtTok(cd.pre)} → ${cd.post ? fmtTok(cd.post) : "?"} tok` : ""}</span>`);
  }
  return `
    <div class="turnrow">
      ${t.origin === "human" && t.preview ? `<div class="who">you</div><div class="prompt">${esc(t.preview)}</div>` : ""}
      ${bits.length ? `<div class="did">${bits.join("")}</div>` : ""}
    </div>`;
}

/* Concrete step names: verb + the actual files/agents, never just the
   abstract activity word (that lives in the click-to-open detail instead). */
function concreteLabel(p) {
  const f = p.top_files[0] ? p.top_files[0][0] : null;
  const more = p.top_files.length > 1 ? ` +${p.top_files.length - 1}` : "";
  const uniq = [...new Set(p.agents)];
  switch (p.label) {
    case "building": return f ? `writing ${f}${more}` : "writing files";
    case "debugging": return f ? `fixing errors in ${f}` : "fixing errors";
    case "verifying": return f ? `running & checking ${f}${more}` : "running commands";
    case "exploring": return f ? `reading ${f}${more}` : "reading & searching";
    case "delegating": return `sent ${p.agents.length} agent${p.agents.length === 1 ? "" : "s"}${uniq.length ? ` — ${uniq.slice(0, 2).join(", ")}` : ""}`;
    case "planning": return "planning the work";
    default: return "talking it through";
  }
}

function renderUsed(d) {
  const agentCounts = new Map();
  for (const a of (d.agents || []).filter((x) => !x.on_abandoned_branch)) agentCounts.set(a.type, (agentCounts.get(a.type) || 0) + 1);
  $("usedrow").innerHTML = [
    ...(d.per_tool || []).slice(0, 10).map((t) =>
      `<button class="pchip" data-g="${esc(t.name)}" data-gx="used ${t.calls}× this session${t.errors ? `, ${t.errors} failed` : ""}">${esc(t.name)} ×${t.calls}</button>`),
    ...[...agentCounts.entries()].map(([n, k]) =>
      `<button class="pchip agent" data-g="agent:${esc(n)}" data-gx="sent out ${k}× this session">◆ ${esc(n)}${k > 1 ? ` ×${k}` : ""}</button>`),
  ].join("") || '<span class="chip">nothing beyond conversation</span>';
}

function renderPhases(phases, turns) {
  if (!phases.length) { $("flow").innerHTML = '<div class="empty">No activity recorded.</div>'; return; }
  $("flow").innerHTML = phases.map((p, i) => {
    const meta = PHASE_META[p.label] || [p.label, "var(--bar)"];
    const stats = [p.wall_ms ? fmtMs(p.wall_ms) : null, p.tokens ? fmtTok(p.tokens) + " tok" : null].filter(Boolean).join(" · ");
    const badges = [
      p.errors ? `<span class="fb">${p.errors} err</span>` : "",
      p.compactions ? `<span class="fb warn">compacted</span>` : "",
    ].join("");
    return `<button class="fnode" data-pi="${i}" title="${esc(meta[0])}">
      <span class="fl"><span class="fdot" style="background:${meta[1]}"></span>${esc(concreteLabel(p))}</span>
      <span class="fs">${esc(stats)}</span>${badges}
    </button>`;
  }).join('<span class="farrow">→</span>');
  for (const node of document.querySelectorAll(".fnode")) {
    node.onclick = () => {
      for (const n of document.querySelectorAll(".fnode")) n.classList.remove("active");
      node.classList.add("active");
      renderPhaseDetail(phases[+node.dataset.pi], turns);
    };
  }
}

function renderPhaseDetail(p, turns) {
  const byIndex = new Map(turns.map((t) => [t.i, t]));
  const meta = PHASE_META[p.label] || [p.label, "var(--bar)"];
  const stats = [p.wall_ms ? fmtMs(p.wall_ms) : null, p.tokens ? fmtTok(p.tokens) + " tok" : null, p.calls ? p.calls + " calls" : null].filter(Boolean).join(" · ");
  const agentCounts = new Map();
  for (const a of p.agents) agentCounts.set(a, (agentCounts.get(a) || 0) + 1);
  const chips = [
    ...p.top_tools.slice(0, 5).map(([n, k]) =>
      `<button class="pchip" data-g="${esc(n)}" data-gx="used ${k}× in this step">${esc(n)}${k > 1 ? ` ×${k}` : ""}</button>`),
    ...[...agentCounts.entries()].slice(0, 4).map(([n, k]) =>
      `<button class="pchip agent" data-g="agent:${esc(n)}" data-gx="sent out ${k}× in this step">◆ ${esc(n)}${k > 1 ? ` ×${k}` : ""}</button>`),
    ...(p.errors ? [`<button class="pchip err" data-g="concept:errors" data-gx="${p.errors} failed call${p.errors === 1 ? "" : "s"} in this step">${p.errors} error${p.errors === 1 ? "" : "s"}</button>`] : []),
    ...(p.compactions ? [`<button class="pchip warn" data-g="concept:compaction" data-gx="happened ${p.compactions}× during this step">compacted ×${p.compactions}</button>`] : []),
  ];
  const inner = [];
  for (let i = p.start_turn; i <= p.end_turn; i++) {
    const t = byIndex.get(i);
    if (!t) continue;
    if (t.origin === "human" || t.calls > 0 || t.interrupted || (t.compactions || []).length) inner.push(turnRow(t));
  }
  $("phaseDetail").innerHTML = `
    <div class="phase">
      <div class="head">
        <span class="plabel"><span class="dot" style="background:${meta[1]}"></span>${esc(concreteLabel(p))}</span>
        <span class="pgloss">${esc(meta[0])}</span>
        <span class="pstats">${esc(stats)}</span>
      </div>
      ${p.top_files.length ? `<div class="pfiles">${p.top_files.map(([n, k]) => `${esc(n)}${k > 1 ? "×" + k : ""}`).join(" · ")}</div>` : ""}
      ${chips.length ? `<div class="pchips">${chips.join("")}</div>` : ""}
      ${p.preview ? `<div class="pline">started by: “${esc(p.preview)}”</div>` : ""}
      ${inner.length ? `<details><summary>${p.turn_count} turn${p.turn_count === 1 ? "" : "s"} inside${p.human_prompts ? ` · ${p.human_prompts} from you` : ""}</summary>${inner.join("")}</details>` : ""}
    </div>`;
}





function findingCard(f) {
  const sav = f.savings;
  const savLine = sav ? `
    <div class="f-line"><span class="k">cost</span>
      ${sav.tokens ? `<b>~${fmtTok(sav.tokens.value)} tokens</b>` : ""}
      ${sav.wall_clock_ms ? `<b>${fmtMs(sav.wall_clock_ms.value)}</b>` : ""}
      <span class="tag ${sav.basis}">${sav.basis === "measured" ? "measured" : "modeled estimate"}</span>
      <span class="method">${esc(sav.method)}</span>
    </div>` : "";
  const auditChip = (v) => v.answer === null ? '<i style="color:var(--ink-3)">abstained</i>'
    : `${v.answer ? '<i style="color:var(--pod-deep)">✓</i>' : '<i style="color:var(--major)">✗</i>'} <i style="color:var(--ink-3)">(${v.votes_true}/${v.votes_false})</i>`;
  const auditLine = f.audit
    ? `<div class="f-line"><span class="k">auditor</span><span style="font: 11px var(--mono)">accurate ${auditChip(f.audit.accurate)} · applicable ${auditChip(f.audit.applicable)} <i style="color:var(--ink-3)">· ${esc(f.audit.model)}${f.audit.escalated ? " +escalated" : ""} — independent LLM second opinion; your answer still counts separately</i></span></div>`
    : "";
  return `
  <div class="finding" data-key="${esc(f.dedupe_key)}" data-turns="${esc(f.turn_indexes.join(","))}">
    <div class="f-head">

      <span class="f-rule">${esc(f.rule.id)}@${esc(f.rule.version)}</span>
      <span class="fb">
        ${["accurate", "applicable"].map((q) => `
        <span class="fbq" title="${q === "accurate" ? "Did the cited events happen as described? Check the evidence below." : "Was the suggested alternative actually usable in this situation?"}">${q}?
          <button data-q="${q}" data-a="1" aria-label="${q}: yes" class="${f.feedback?.[q] === true ? "on-yes" : ""}">✓</button>
          <button data-q="${q}" data-a="0" aria-label="${q}: no" class="${f.feedback?.[q] === false ? "on-no" : ""}">✗</button>

      </span>
    </div>

      <div class="f-desc">${esc(f.description)}</div>

        ${f.evidence_excerpts.map((e) => `
          <div class="ev"><span class="kind">${esc(e.kind)}</span><span class="snip">${esc(e.snippet)}</span><span class="loc">${esc((e.file || "").split("/").pop())}:${e.line}</span></div>`).join("")}
      </details>

function wireFindings(d) {
  for (const card of document.querySelectorAll(".finding")) {
    card.addEventListener("mouseenter", () => highlightTurns(card.dataset.turns, true));
    card.addEventListener("mouseleave", () => highlightTurns(card.dataset.turns, false));
    for (const btn of card.querySelectorAll(".fb button")) {
      btn.onclick = async () => {
        const question = btn.dataset.q;
        const answer = btn.dataset.a === "1";
        try {
          await api("/api/feedback", { method: "POST", headers: { "content-type": "application/json" },
            body: JSON.stringify({ key: card.dataset.key, question, answer }) });
          for (const b of card.querySelectorAll(`.fb button[data-q="${question}"]`)) b.className = "";
          btn.className = answer ? "on-yes" : "on-no";
          const f = d.findings.find((x) => x.dedupe_key === card.dataset.key);
          if (f) { f.feedback = f.feedback || {}; f.feedback[question] = answer; }
        } catch (e) { alert("could not record feedback: " + e.message); }
      };
    }
  }
}

function highlightTurns(turnsAttr, on) {
  if (!turnsAttr) return;
  const set = new Set(turnsAttr.split(",").filter(Boolean).map(Number));
  for (const bar of document.querySelectorAll("#wave .wbar")) {
    if (set.has(+bar.dataset.i)) bar.setAttribute("fill", on ? "var(--pod)" : (state.data.turns[+bar.dataset.i].origin === "human" ? "var(--bar)" : "var(--bar-notif)"));
  }
}

function skillCard(s) {
  const rate = s.rate !== null ? `<div class="rate">used when needed: ${s.uses} of ${s.uses + s.misses}${s.trend === "up" ? " ↑" : s.trend === "down" ? " ↓" : ""}</div>` : "";
  const waste = s.state === "opportunities_missed" && (s.missed_tokens > 0 || s.missed_wall_ms > 60000)
    ? `<div class="waste">measured waste: ${s.missed_tokens > 0 ? "~" + fmtTok(s.missed_tokens) + " tokens" : ""}${s.missed_wall_ms > 60000 ? " · " + fmtMs(s.missed_wall_ms) : ""}</div>` : "";
  const next = s.suggestion ? `<div class="next"><b>Next: ${esc(s.suggestion.title)}.</b> ${esc(s.suggestion.reason)}</div>` : "";
  const note = s.measurement_note ? `<div class="note">${esc(s.measurement_note)}</div>` : "";
  return `
  <div class="skill">
    <h3>${esc(s.title)}</h3>
    <div class="tagline">${esc(s.tagline)}</div>
    <span class="state ${esc(s.state)}">${esc(s.state_label)}</span>
    <div class="tagline">${esc(s.state_blurb)}</div>
    ${rate}${waste}${next}
    <details><summary>techniques (${s.techniques.filter((t) => t.tried).length}/${s.techniques.length} tried)</summary>
      <div class="chips" style="margin-top:8px">${s.techniques.map((t) => `<span class="chip ${t.tried ? "used" : ""}" title="${esc(t.lesson)}">${esc(t.title)}${t.count > 1 ? ` ${t.count}×` : ""}${t.source === "environment" ? " ⚙" : ""}</span>`).join("")}</div>
    </details>
    ${note}
  </div>`;
}

function showLibrary() {
  state.view = "library"; state.currentId = null; renderSidebar(); closeSide(); setHash("library");
  $("libraryBtn").classList.add("active");
  const KIND_LABEL = { config: "Settings", pattern: "Ways of working", mcp: "Connected tools (MCP)", skill: "Skills", subagent: "Subagents", script: "Scripts", workflow: "Workflows" };
  const kinds = [...new Set(state.registry.map((e) => e.kind))];
  $("view").innerHTML = `
    <span class="eyebrow">the shelf</span>
    <h1>Library — everything damame can point you at</h1>
    <div class="sub">${state.registry.length} recipes · browsing is always open; recommendations are pushed only when your own sessions show the evidence</div>
    ${kinds.map((k) => `
      <div class="section"><h2 class="eyebrow">${esc(KIND_LABEL[k] || k)}</h2>
        <div class="libgrid">
          ${state.registry.filter((e) => e.kind === k).map((e) => `
            <div class="libcard">
              <h3>${esc(e.title)}<span class="lk">${esc(e.kind)}</span></h3>
              <div class="lw">${esc(e.what_it_is)}</div>
              <details><summary>how to do it · ${esc(e.status)}</summary>
                <div class="howto-body">
                  <ol>${e.how_to.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>
                  ${e.notes ? `<div class="hb-notes">${esc(e.notes)}</div>` : ""}
                  <div class="hb-prov"><span class="tag ${e.status === "verified" ? "measured" : "modeled"}">${esc(e.status)}</span> <span>source: ${esc(e.source)}</span></div>
                </div>
              </details>
            </div>`).join("")}
        </div>
      </div>`).join("")}`;
}

async function showRules() {
  state.view = "rules"; renderSidebar(); closeSide(); setHash("rules");
  $("view").innerHTML = '<div class="loading">reading rules…</div>';
  const [rules, stats] = await Promise.all([api("/api/rules"), api("/api/feedback/stats")]);
  const byRule = Object.fromEntries(stats.rules.map((s) => [s.rule_id, s]));
  const recurrenceByRule = Object.fromEntries(stats.recurrence.map((r) => [r.rule_id, r]));
  const agreementByRule = Object.fromEntries((stats.auditor?.agreement ?? []).map((a) => [a.rule_id, a]));
  const health = stats.auditor?.health ?? [];
  const degraded = health.some((h) => h.honeypots_total >= 5 && h.honeypot_catch_rate !== null && h.honeypot_catch_rate < 0.8);
  const healthLine = health.length
    ? `<div class="sub" style="margin-top:6px">auditor: ${health.map((h) => `${esc(h.series)} — honeypot catch ${h.honeypot_catch_rate === null ? "—" : Math.round(h.honeypot_catch_rate * 100) + "%"} (${h.honeypots_caught}/${h.honeypots_total}), abstain ${Math.round(h.abstention_rate * 100)}%`).join(" · ")}${degraded ? ' — <b style="color:var(--major)">catch rate degraded: treat auditor verdicts with care</b>' : ""}</div>`
    : "";
  const pbar = (p) => p === null ? '<span class="mono" style="color:var(--ink-3)">—</span>'
    : `<div class="precision-bar" title="${p.toFixed(2)}"><i style="width:${Math.round(p * 100)}%"></i></div><span class="mono">${p.toFixed(2)}</span>`;
  $("view").innerHTML = `
    <span class="eyebrow">registry</span>
    <h1>Rules &amp; measured accuracy</h1>
    <div class="sub">factual = accurate-yes ÷ accurate answers (checkable against evidence). "Acted on" is behavioral: the pattern's frequency in your sessions before vs after damame first surfaced it — no opinion involved. All local.</div>
    ${healthLine}
    <div class="section">
    <table class="rules">
      <tr><th>rule</th><th>what it detects</th><th>emitted</th><th>accurate y/n</th><th>applies y/n</th><th>factual</th><th>auditor agrees</th><th>acted on (before → after /100 turns)</th></tr>
      ${rules.map((r) => {
        const s = byRule[r.id];
        const rec = recurrenceByRule[r.id];
        const acted = !rec || rec.verdict === "insufficient_history"
          ? '<span class="mono" style="color:var(--ink-3)">not enough history yet</span>'
          : `<span class="mono">${rec.rate_before.toFixed(1)} → ${rec.rate_after.toFixed(1)}</span> <span class="mono" style="color:${rec.verdict === "improving" ? "var(--pod-deep)" : rec.verdict === "worsening" ? "var(--moderate)" : "var(--ink-3)"}">${rec.verdict}${rec.verdict !== "unchanged" && rec.change_pct !== null ? ` ${Math.round(rec.change_pct)}%` : ""}</span>`;
        return `<tr>
          <td class="mono">${esc(r.id)}<br><span style="color:var(--ink-3)">v${esc(r.version)}</span></td>
          <td>${esc(r.summary)}</td>
          <td class="mono">${s ? s.emitted : 0}</td>
          <td class="mono">${s ? `${s.accurate_yes}/${s.accurate_no}` : "0/0"}</td>
          <td class="mono">${s ? `${s.applicable_yes}/${s.applicable_no}` : "0/0"}</td>
          <td>${pbar(s ? s.factual_precision : null)}</td>
          <td class="mono">${agreementByRule[r.id] ? `${agreementByRule[r.id].agreed_questions}/${agreementByRule[r.id].compared_questions}` : '<span style="color:var(--ink-3)">—</span>'}</td>
          <td>${acted}</td>
        </tr>`;
      }).join("")}
    </table></div>`;
}

async function showEval() {
  state.view = "eval"; renderSidebar(); closeSide(); setHash("eval");
  $("view").innerHTML = '<div class="loading">loading the ground-truth corpus…</div>';
  let data;
  try { data = await api("/api/eval/archetypes"); }
  catch (e) { $("view").innerHTML = `<div class="empty">could not load the corpus: ${esc(e.message)}</div>`; return; }
  const plants = data.archetypes.filter((a) => a.kind === "plant");
  const negs = data.archetypes.filter((a) => a.kind === "near-miss");

  const trust = [
    ["Detectors", "planted crimes", "Manufactured sessions with a defect built in by construction, plus innocent near-misses one unit under each threshold. CI demands perfect recall on the plants and zero false positives on the innocents — one miss fails the build."],
    ["LLM judge", "counterfeit honeypots", "Every audit batch secretly includes findings corrupted by construction (numbers ×10, evidence swapped). The judge must refute them; its catch-rate is a live, label-free accuracy score."],
    ["AI brief", "citation gate", "The story generator never sees the transcript — only a measured digest with stable ids. Every claim must cite one; a dumb string check deletes uncited claims before render."],
    ["Score", "ordering gate", "Planted-waste sessions must score strictly below clean ones; innocents and provider-side problems stay high — enforced in CI."],
    ["The tool itself", "you, twice + behavior", "Two narrow feedback questions build per-rule precision, and recurrence measures whether flagged patterns actually shrink in your later sessions — behavior, not opinion."],
  ];

  const archCard = (a) => `
    <div class="arch-card">
      <span class="arch-badge ${a.kind === "plant" ? "plant" : "near"}">${a.kind === "plant" ? "plants a defect" : "near-miss · must stay silent"}</span>
      <div class="an">${esc(a.archetype)}</div>
      <span class="ak">${a.kind === "plant"
        ? `must fire: <b style="color:var(--pod-deep)">${esc(a.expected.join(", "))}</b> · everything else must stay silent`
        : `built one unit under a threshold — no detector may fire`}</span>
    </div>`;

  $("view").innerHTML = `
    <span class="eyebrow">evaluation</span>
    <h1>Ground truth — how the detectors are proven right</h1>
    <div class="sub">On a real session there is no answer key: nobody knows the objectively correct findings for a billion-token transcript. So damame manufactures sessions where the truth is known <i>by construction</i>, runs the real production pipeline over them, and demands it gets every one right. This is that corpus — and every other layer is graded by a different mechanism, so no component grades its own homework.</div>

    <div class="section">
      <table class="trust-matrix">
        <tr><th>layer</th><th>graded by</th><th>how</th></tr>
        ${trust.map(([l, g, h]) => `<tr><td>${esc(l)}</td><td class="grader">${esc(g)}</td><td>${esc(h)}</td></tr>`).join("")}
      </table>
    </div>

    <div class="evalrun">
      <div class="evalrun-cta">
        <button id="runEvalBtn">Run the eval now</button>
        <span class="er-note">generates a fresh corpus in your browser session and runs the real detectors over it — a few seconds</span>
      </div>
      <div id="evalResult"></div>
    </div>

    <div class="section">
      <h2 class="eyebrow">The answer keys · ${data.total} archetypes</h2>
      <div class="gloss"><b>${plants.length} plant a defect</b> (one per detector) and <b>${negs.length} are near-miss negatives</b> engineered to sit just under a threshold — testing the decision boundary, where false positives are actually born, not just the easy cases.</div>
      <div class="det-cat-head">Plants — a defect built in, one detector must catch it</div>
      <div class="arch-grid">${plants.map(archCard).join("")}</div>
      <div class="det-cat-head">Near-misses — innocent look-alikes, nothing may fire</div>
      <div class="arch-grid">${negs.map(archCard).join("")}</div>
    </div>

    <div class="grading">reproducible by construction — a failure names the archetype and seed, and that seed regenerates the byte-identical failing session. Same from the terminal: <span class="mono">damame eval --per 20 --seed 7</span></div>`;

  $("runEvalBtn").onclick = async () => {
    const btn = $("runEvalBtn");
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    btn.disabled = true; btn.textContent = "running…";
    const t0 = performance.now();
    // The real work is kicked off immediately; the steps below are the actual
    // stages of that run, revealed one at a time so the gate is watchable.
    const runP = api("/api/eval/run?per=2&seed=7").catch((e) => ({ error: String(e.message || e) }));
    const steps = [
      ["generate corpus", "54 fake sessions written across 27 archetypes — 16 with a planted defect, 11 innocent near-misses"],
      ["parse + run detectors", "the real production pipeline over every session"],
      ["check answer keys", "did each planted defect fire — and did anything wrongly fire on an innocent"],
      ["assert the gate", "recall = 1.00 and false positives = 0, or the build fails"],
    ];
    $("evalResult").innerHTML = `
      <div class="cirun">
        <div class="ci-check-head run" id="ciHead"><span class="ci-dot"><span class="ci-spin"></span></span><span>corpus gate — running locally…</span><span class="ci-meta" id="ciMeta"></span></div>
        <div class="ci-steps" id="ciSteps">${steps.map((s, i) => `
          <div class="ci-step" id="ci-step-${i}"><span class="ci-ic">○</span><span><span class="ci-name">${esc(s[0])}</span> — <span class="ci-sub">${esc(s[1])}</span></span></div>`).join("")}</div>
      </div>`;
    for (let i = 0; i < steps.length; i++) {
      const el = $(`ci-step-${i}`);
      el.classList.add("pending"); el.querySelector(".ci-ic").innerHTML = '<span class="ci-spin"></span>';
      if (!reduce) await sleep(i === 0 ? 500 : 620);
      el.classList.remove("pending"); el.classList.add("done"); el.querySelector(".ci-ic").textContent = "✓";
    }
    const r = await runP;
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    if (r.error) {
      $("ciHead").className = "ci-check-head fail";
      $("ciHead").innerHTML = `<span class="ci-dot">✕</span><span>ci / corpus gate — failed</span>`;
      $("evalResult").insertAdjacentHTML("beforeend", `<div class="er-banner fail">run failed: ${esc(r.error)}</div>`);
      btn.disabled = false; btn.textContent = "Run the eval again"; return;
    }
    const passed = r.failures.length === 0;
    $("ciHead").className = `ci-check-head ${passed ? "pass" : "fail"}`;
    $("ciHead").innerHTML = `<span class="ci-dot">${passed ? "✓" : "✕"}</span><span>corpus gate — ${passed ? "passed locally" : "FAILED"}</span><span class="ci-meta">${secs}s</span>`;
    const rows = r.scores.map((s) => {
      const rec = s.recall === null ? "—" : s.recall.toFixed(2);
      const prec = s.precision === null ? "—" : s.precision.toFixed(2);
      const perfect = s.recall === 1 && s.precision === 1;
      return `<tr><td>${esc(s.rule_id)}</td><td>${s.expected_sessions}</td><td>${s.fired_when_expected}</td><td>${s.false_positives}</td><td class="${perfect ? "perfect" : ""}">${rec}</td><td class="${perfect ? "perfect" : ""}">${prec}</td></tr>`;
    }).join("");
    $("evalResult").insertAdjacentHTML("beforeend", `
      <div class="er-banner ${passed ? "pass" : "fail"}" style="margin-top:14px">${passed
        ? `✓ ${r.sessions} sessions · every planted defect caught · zero false positives`
        : `✗ ${r.failures.length} failure(s): ${r.failures.slice(0, 4).map((f) => `${esc(f.kind)} ${esc(f.rule)} in ${esc(f.archetype)}#${f.seed}`).join(" · ")}`}</div>
      <table class="er-table">
        <tr><th>rule</th><th>planted</th><th>caught</th><th>false-pos</th><th>recall</th><th>precision</th></tr>
        ${rows}
      </table>
      <div class="ci-yaml">Same code, two places. What you just watched ran <b>locally</b> (same machinery as <span class="mono">damame eval</span>). The <b>identical</b> gate runs on GitHub on every push/PR via <b>.github/workflows/ci.yml</b>:
  on: [push, pull_request]  ·  node 20 & 22
  steps: checkout → npm install → <b>npx tsc</b> → <b>npx vitest run</b>   ← the corpus test lives in here
There a red gate blocks the merge. (Steps paced above for readability; the real run finishes in under a second.)</div>`);
    btn.disabled = false; btn.textContent = "Run the eval again";
  };
}

$("rulesBtn").onclick = showRules;
$("evalBtn").onclick = showEval;
$("overviewBtn").onclick = showOverview;
$("libraryBtn").onclick = showLibrary;
$("menuBtn").onclick = () => document.querySelector(".side").classList.toggle("open");
initThemes();
boot().catch((e) => { $("view").innerHTML = `<div class="empty">damame could not start: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
