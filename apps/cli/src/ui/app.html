<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F0EFE9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1F1E1D">
<title>damame</title>
<style>
/* ————— tokens: paper-ledger instrument. Light is home; dark is a full variant.
   Severity is a STATUS palette: every use carries a text label or shape, never
   color alone (validated for surface contrast in both modes). ————— */
:root {
  color-scheme: light dark;
  --paper: #FAFAF7; --card: #FFFFFF; --ink: #1C2420; --ink-2: #5A665F; --ink-3: #8A948C;
  --hair: #E3E6E0; --hair-2: #EEF0EA;
  --pod: #5B8C3E; --pod-deep: #3E6B2A; --pod-tint: #EAF2E2;
  --major: #B33A28; --major-tint: #F7E9E6;
  --moderate: #A16E1B; --moderate-tint: #F6EEDD;
  --minor: #4E7FA8; --minor-tint: #E8EFF5;
  --info: #7A837D; --info-tint: #EFF1EE;
  --bar: #CBD2C7; --bar-notif: #DFE4DA;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: ui-serif, "Iowan Old Style", "Palatino", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #141815; --card: #1B211C; --ink: #E8ECE7; --ink-2: #9AA69D; --ink-3: #6E786F;
    --hair: #2A302B; --hair-2: #222823;
    --pod: #8FBF6A; --pod-deep: #A9D18A; --pod-tint: #24301E;
    --major: #E0785C; --major-tint: #35221D;
    --moderate: #D9A84E; --moderate-tint: #332A18;
    --minor: #7FA7C9; --minor-tint: #1E2933;
    --info: #8B948D; --info-tint: #232824;
    --bar: #39423A; --bar-notif: #2C332D;
  }
}
/* ————— themes: explicit palettes override the auto (system) tokens ————— */
:root[data-theme="paper"] {
  color-scheme: light;
  --paper: #FAFAF7; --card: #FFFFFF; --ink: #1C2420; --ink-2: #5A665F; --ink-3: #8A948C;
  --hair: #E3E6E0; --hair-2: #EEF0EA;
  --pod: #5B8C3E; --pod-deep: #3E6B2A; --pod-tint: #EAF2E2;
  --major: #B33A28; --major-tint: #F7E9E6;
  --moderate: #A16E1B; --moderate-tint: #F6EEDD;
  --minor: #4E7FA8; --minor-tint: #E8EFF5;
  --info: #7A837D; --info-tint: #EFF1EE;
  --bar: #CBD2C7; --bar-notif: #DFE4DA;
}
:root[data-theme="clay"] {
  color-scheme: light;
  --paper: #F0EFE9; --card: #FAF9F5; --ink: #1F1E1D; --ink-2: #61605B; --ink-3: #91908A;
  --hair: #E3E1D7; --hair-2: #EBE9E0;
  --pod: #CC785C; --pod-deep: #9A4A2B; --pod-tint: #F5E4DC;
  --major: #B0442C; --major-tint: #F6E3DD;
  --moderate: #9A6B1F; --moderate-tint: #F3EAD7;
  --minor: #5B7C99; --minor-tint: #E7EEF3;
  --info: #8A8984; --info-tint: #EDECE5;
  --bar: #D8D5C8; --bar-notif: #E5E2D6;
}
:root[data-theme="slate"] {
  color-scheme: dark;
  --paper: #1F1E1D; --card: #262524; --ink: #F0EFE9; --ink-2: #B5B3AC; --ink-3: #82817B;
  --hair: #3A3936; --hair-2: #302F2C;
  --pod: #D97757; --pod-deep: #E8987C; --pod-tint: #3A2A22;
  --major: #E8846B; --major-tint: #3D241E;
  --moderate: #D9A84E; --moderate-tint: #383017;
  --minor: #8FAFC9; --minor-tint: #23303B;
  --info: #98968E; --info-tint: #2C2B28;
  --bar: #45443F; --bar-notif: #363531;
}
:root[data-theme="midnight"] {
  color-scheme: dark;
  --paper: #141815; --card: #1B211C; --ink: #E8ECE7; --ink-2: #9AA69D; --ink-3: #6E786F;
  --hair: #2A302B; --hair-2: #222823;
  --pod: #8FBF6A; --pod-deep: #A9D18A; --pod-tint: #24301E;
  --major: #E0785C; --major-tint: #35221D;
  --moderate: #D9A84E; --moderate-tint: #332A18;
  --minor: #7FA7C9; --minor-tint: #1E2933;
  --info: #8B948D; --info-tint: #232824;
  --bar: #39423A; --bar-notif: #2C332D;
}
:root[data-theme="ocean"] {
  color-scheme: dark;
  --paper: #0C141D; --card: #13202C; --ink: #E4EDF4; --ink-2: #93A7B8; --ink-3: #64798A;
  --hair: #22303E; --hair-2: #1A2733;
  --pod: #38BDF8; --pod-deep: #7DD3FC; --pod-tint: #0F2A3C;
  --major: #F87171; --major-tint: #3A1D1F;
  --moderate: #FBBF24; --moderate-tint: #3A2E14;
  --minor: #A78BFA; --minor-tint: #251F3A;
  --info: #8CA3B5; --info-tint: #1B2836;
  --bar: #33475A; --bar-notif: #26394B;
}
:root[data-theme="forest"] {
  color-scheme: dark;
  --paper: #0F1511; --card: #16211A; --ink: #E7EFE9; --ink-2: #9DB3A4; --ink-3: #6C8274;
  --hair: #263A2D; --hair-2: #1C2B22;
  --pod: #A3E635; --pod-deep: #BEF264; --pod-tint: #1E3323;
  --major: #F87171; --major-tint: #391D1D;
  --moderate: #FACC15; --moderate-tint: #37300F;
  --minor: #67E8F9; --minor-tint: #123239;
  --info: #8FA79A; --info-tint: #1F2E25;
  --bar: #36503F; --bar-notif: #263B2E;
}
:root[data-theme="sunset"] {
  color-scheme: light;
  --paper: #FFF8F2; --card: #FFFFFF; --ink: #2A211C; --ink-2: #6B5B51; --ink-3: #9A897E;
  --hair: #EFE0D4; --hair-2: #F7ECE3;
  --pod: #E0632D; --pod-deep: #B84A1B; --pod-tint: #FBE8DC;
  --major: #C42D2D; --major-tint: #F9E2E2;
  --moderate: #B07C1C; --moderate-tint: #F6ECD9;
  --minor: #3E7CA8; --minor-tint: #E5EFF6;
  --info: #8A7F78; --info-tint: #F1ECE8;
  --bar: #E4CDBB; --bar-notif: #EFDCCB;
}
:root[data-theme="violet"] {
  color-scheme: dark;
  --paper: #12101C; --card: #191627; --ink: #EAE6F7; --ink-2: #A79FC4; --ink-3: #746C93;
  --hair: #2A2540; --hair-2: #201C33;
  --pod: #A78BFA; --pod-deep: #C4B5FD; --pod-tint: #251F3F;
  --major: #FB7185; --major-tint: #3A1B26;
  --moderate: #FBBF24; --moderate-tint: #37300F;
  --minor: #38BDF8; --minor-tint: #12293A;
  --info: #8E86AC; --info-tint: #211D36;
  --bar: #3B3358; --bar-notif: #2C2645;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 450 14.5px/1.6 var(--sans); }
.app { display: grid; grid-template-columns: 288px 1fr; height: 100vh; }
.menu-btn { display: none; position: fixed; top: 10px; left: 10px; z-index: 21; background: var(--card); border: 1px solid var(--hair); border-radius: 8px; padding: 6px 10px; cursor: pointer; color: var(--ink); font: 12px var(--mono); }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; top: 0; bottom: 0; left: 0; width: min(80vw, 300px); z-index: 20; background: var(--paper); transform: translateX(-105%); transition: transform .18s ease; box-shadow: 0 0 30px rgba(0,0,0,.25); }
  .side.open { transform: none; }
  .menu-btn { display: block; }
  .wrap { padding-top: 48px; }
}

/* ————— sidebar ————— */
.side { border-right: 1px solid var(--hair); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: baseline; gap: 8px; padding: 18px 18px 14px; border-bottom: 1px solid var(--hair); }
.brand b { font: 600 19px var(--serif); letter-spacing: -0.01em; }
.brand b::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50% 50% 50% 2px; background: var(--pod); margin-right: 8px; }
.brand span { color: var(--ink-3); font: 10.5px var(--mono); }
.sessions { overflow-y: auto; flex: 1; padding: 8px; }
.sess { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 10px 10px 8px; cursor: pointer; color: var(--ink); }
.sess:hover { background: var(--hair-2); }
.sess.active { background: var(--pod-tint); }
.sess .t { font-weight: 550; font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sess .m { color: var(--ink-3); font: 10.5px var(--mono); margin-top: 3px; }
.side-foot { border-top: 1px solid var(--hair); padding: 10px; }
.foot-label { font: 600 9.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); padding: 2px 10px 4px; }
.navbtn { width: 100%; background: none; border: 0; border-radius: 8px; text-align: left; padding: 7px 10px; cursor: pointer; color: var(--ink-2); font: 12px var(--mono); }
.navbtn:hover, .navbtn.active { background: var(--hair-2); color: var(--ink); }
.local-note { color: var(--ink-3); font: 10px var(--mono); padding: 8px 10px 2px; }

/* ————— main ————— */
.main { overflow-y: auto; min-height: 0; }
.wrap { max-width: 980px; margin: 0 auto; padding: 26px 32px 80px; }
.eyebrow { font: 600 10px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
h1 { font: 600 26px/1.25 var(--serif); letter-spacing: -0.01em; margin: 6px 0 2px; }
.sub { color: var(--ink-2); font: 11.5px var(--mono); }
.section { margin-top: 30px; scroll-margin-top: 14px; }
.section > .eyebrow { display: block; padding-bottom: 8px; border-bottom: 1px solid var(--hair); margin-bottom: 6px; }
.gloss { color: var(--ink-2); font-size: 12px; max-width: 76ch; margin-bottom: 14px; }

/* ————— session brief: a hero you want to read ————— */
/* —— three surfaces (Sprint B: functional pass, clay styling) —— */
.fixzone { margin-top: 26px; border: 1px solid var(--hair); border-radius: 12px; padding: 16px 18px; background: var(--card); }
.fixzone h3 { margin: 0 0 4px; font: 600 14px var(--sans); }
.fixzone .fx-sub { color: var(--ink-3); font-size: 12px; }
.fixzone ul { margin: 10px 0 0; padding: 0; list-style: none; }
.fixzone li { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-top: 1px dashed var(--hair); font-size: 13px; }
.fixzone li .dest { margin-left: auto; font: 10px var(--mono); color: var(--pod-deep); background: var(--pod-tint); border-radius: 5px; padding: 2px 7px; white-space: nowrap; }
.coachwrap { margin-top: 22px; display: grid; gap: 12px; }
.coachcard { border: 1px solid var(--hair); border-radius: 12px; padding: 16px 18px; background: var(--card); }
.coachcard.flagship { border-color: var(--pod-deep); }
.coachcard .cc-head { font: 500 16px/1.4 var(--serif); max-width: 60ch; }
.coachcard .cc-body { color: var(--ink-2); font-size: 12.5px; margin-top: 6px; max-width: 72ch; }
.coachcard .cc-meta { margin-top: 8px; font: 11px var(--mono); color: var(--ink-3); }
.impact { font: 600 10px var(--mono); border-radius: 5px; padding: 2px 7px; margin-right: 8px; text-transform: uppercase; letter-spacing: .04em; }
.impact.quality { background: var(--pod-tint); color: var(--pod-deep); }
.impact.time { background: var(--minor-tint); color: var(--minor); }
.impact.limits { background: var(--moderate-tint); color: var(--moderate); }
.notyours { margin-top: 22px; border: 1px dashed var(--hair); border-radius: 12px; padding: 12px 18px; color: var(--ink-3); font-size: 12.5px; }
.notyours b { color: var(--ink-2); font-weight: 600; }
.auditbar { margin-top: 22px; display: flex; gap: 12px; align-items: center; font-size: 12.5px; color: var(--ink-3); }
.auditbar button { font: 600 12px var(--sans); border: 1px solid var(--pod-deep); color: var(--pod-deep); background: none; border-radius: 8px; padding: 7px 14px; cursor: pointer; }
.auditbar button:hover { background: var(--pod-tint); }
.auditbar button:disabled { opacity: .5; cursor: default; }
.briefbox { margin-top: 30px; min-height: 112px; }
.briefbox .big { font: 500 clamp(25px, 3.4vw, 32px)/1.42 var(--serif); letter-spacing: -0.005em; max-width: 42ch; }
.briefbox .cite { background: none; border: 0; cursor: pointer; color: var(--pod-deep); font: 12px var(--mono); padding: 0 2px; vertical-align: 10px; }
.briefbox li .cite { font-size: 10px; vertical-align: 3px; }
.briefbox .tagrow { margin-top: 12px; }
.briefbox .tagchip { font: 600 10px var(--mono); border-radius: 5px; padding: 3px 9px; background: var(--pod-tint); color: var(--pod-deep); margin-right: 6px; }
.briefbox details { margin-top: 12px; }
.briefbox summary { cursor: pointer; list-style: none; color: var(--ink-3); font: 11px var(--mono); }
.briefbox summary::before { content: "▸ "; }
.briefbox details[open] summary::before { content: "▾ "; }
.briefbox ul { margin: 8px 0 0; padding-left: 18px; }
.briefbox li { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; max-width: 76ch; }
.briefbox .blabel { font: 600 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-top: 10px; }
.briefbox .bnote { color: var(--ink-3); font: 10.5px var(--mono); margin-top: 8px; }
/* the story spine: one-liners first, depth on demand */
.story { margin-top: 18px; position: relative; padding-left: 30px; }
.story::before { content: ""; position: absolute; left: 11px; top: 12px; bottom: 12px; width: 2px; background: var(--hair); }
.beat { position: relative; margin-bottom: 4px; }
.beat .bnum { position: absolute; left: -30px; top: 7px; width: 22px; height: 22px; border-radius: 50%; background: var(--card); border: 1px solid var(--hair); color: var(--ink-3); font: 600 10.5px var(--mono); display: flex; align-items: center; justify-content: center; z-index: 1; }
.beat summary { cursor: pointer; list-style: none; padding: 7px 0; font: 500 14px/1.5 var(--sans); }
.beat summary::after { content: " ▸"; color: var(--ink-3); font: 10px var(--mono); }
.beat details[open] summary::after { content: " ▾"; }
.beat .bdepth { background: var(--card); border: 1px solid var(--hair); border-radius: 10px; padding: 11px 13px; margin: 2px 0 10px; font-size: 12.5px; color: var(--ink-2); max-width: 76ch; }
.beat .bdepth .brow { margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.briefbox .bwarn { color: var(--moderate); font: 11px var(--mono); margin-top: 8px; }
.briefbox .muted { color: var(--ink-3); font: 11.5px var(--mono); }

/* ————— click-to-learn popover ————— */
.info-pop { position: fixed; z-index: 30; background: var(--card); border: 1px solid var(--hair); border-radius: 10px; padding: 12px 14px; max-width: 320px; box-shadow: 0 10px 32px rgba(0,0,0,.22); display: none; }
.info-pop .it { font-weight: 600; font-size: 13px; }
.info-pop .ik { font: 600 9px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--pod-deep); background: var(--pod-tint); border-radius: 4px; padding: 2px 6px; margin-left: 7px; vertical-align: 1px; }
.info-pop .ib { color: var(--ink-2); font-size: 12.5px; margin-top: 5px; }
.info-pop .ix { color: var(--ink-3); font: 10.5px var(--mono); margin-top: 7px; }

/* ————— session score: overall header + vertical big cards ————— */
.score-head { margin-top: 20px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.score-head .n { font: 600 56px/1 var(--serif); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.score-head .cap { font: 11px var(--mono); color: var(--ink-3); }
.scap { font: 10.5px var(--mono); color: var(--ink-3); margin-top: 6px; }
.scap b { color: var(--pod-deep); font-weight: 600; }
.scards { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.scard { background: var(--card); border: 1px solid var(--hair); border-radius: 16px; padding: 16px 20px; cursor: pointer; text-align: left; color: var(--ink); font: inherit; width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 18px; align-items: center; }
.scard .sl { font: 650 15px var(--sans); }
.scard .sd { color: var(--ink-2); font-size: 12px; max-width: 60ch; }
.scard .sv { grid-row: 1 / 3; font: 700 30px/1 var(--mono); font-variant-numeric: tabular-nums; align-self: center; transition: transform .18s cubic-bezier(.2,.7,.3,1); }
.scard .sbar { grid-column: 1 / 3; height: 6px; background: var(--hair); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.scard .sbar i { display: block; height: 100%; background: var(--pod); border-radius: 3px; transform-origin: left; }
.scard .sbar i.low { background: var(--major); }
.scard .sbar i.mid { background: var(--moderate); }
.scard .sv.low { color: var(--major); }
.scard .sv.mid { color: var(--moderate); }
@media (prefers-reduced-motion: no-preference) {
  .scard { transition: transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s ease, border-color .18s ease; }
  .scard:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0,0,0,.12); }
  .scard:hover .sv { transform: scale(1.12); }
  .scard .sbar i { animation: growbar .5s cubic-bezier(.2,.7,.3,1) backwards; }
  @keyframes growbar { from { transform: scaleX(0); } }
}
.scard:hover { border-color: var(--pod); }

/* ————— theme picker ————— */
.themes { position: fixed; right: 14px; bottom: 14px; z-index: 35; display: flex; gap: 8px; background: var(--card); border: 1px solid var(--hair); border-radius: 999px; padding: 8px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
.tdot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--hair); cursor: pointer; padding: 0; }
.tdot:hover { transform: scale(1.15); }
.tdot.active { border-color: var(--pod); outline: 2px solid var(--pod); outline-offset: 1px; }
@media (prefers-reduced-motion: no-preference) { .tdot { transition: transform .12s ease; } }

/* ————— progress bars ————— */
.progress { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 60; display: none; background: color-mix(in oklab, var(--pod) 20%, transparent); }
.progress.on { display: block; }
.progress i { display: block; height: 100%; width: 30%; background: var(--pod); border-radius: 2px; }
@media (prefers-reduced-motion: no-preference) {
  .progress i { animation: sweep 1.1s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-110%); } 100% { transform: translateX(433%); } }
}
.mini-progress { height: 3px; background: var(--hair); border-radius: 2px; overflow: hidden; margin-top: 10px; max-width: 340px; }
.mini-progress i { display: block; height: 100%; width: 30%; background: var(--pod); }
@media (prefers-reduced-motion: no-preference) { .mini-progress i { animation: sweep 1.2s ease-in-out infinite; } }
.spen { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--hair-2); font: 12px var(--mono); }
.spen:last-child { border-bottom: 0; }
.spen .pr { flex: 1; }
.spen .pp { color: var(--major); font-variant-numeric: tabular-nums; }

/* ————— simple home: score line, section cards, back link ————— */
.scoreline { margin-top: 20px; display: flex; gap: 18px; align-items: center; background: var(--card); border: 1px solid var(--hair); border-radius: 16px; padding: 14px 20px; text-decoration: none; color: var(--ink); }
.scoreline:hover { border-color: var(--pod); }
.scoreline .n { font: 600 44px/1 var(--serif); font-variant-numeric: tabular-nums; }
.scoreline .sl-cap { display: block; font: 10.5px var(--mono); color: var(--ink-3); }
.scoreline .statline { display: block; font: 12px var(--mono); color: var(--ink-2); margin-top: 5px; font-variant-numeric: tabular-nums; }
.seccards { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; }
.seccard { display: flex; align-items: center; gap: 16px; background: var(--card); border: 1px solid var(--hair); border-radius: 16px; padding: 18px 20px; text-decoration: none; color: var(--ink); }
.seccard:hover { border-color: var(--pod); }
@media (prefers-reduced-motion: no-preference) {
  .seccard, .scoreline { transition: transform .18s cubic-bezier(.2,.7,.3,1), border-color .18s ease, box-shadow .18s ease; }
  .seccard:hover, .scoreline:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0,0,0,.10); }
}
.seccard .sc-body { flex: 1; min-width: 0; }
.seccard .sc-title { display: block; font: 600 16px var(--serif); }
.seccard .sc-sent { display: block; color: var(--ink-2); font-size: 12.5px; margin-top: 3px; max-width: 70ch; }
.seccard .sc-count { flex: none; font: 600 15px var(--mono); color: var(--pod-deep); background: var(--pod-tint); border-radius: 999px; min-width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; padding: 0 9px; font-variant-numeric: tabular-nums; }
.seccard .sc-arrow { flex: none; color: var(--ink-3); font: 14px var(--mono); }
.backlink { display: inline-block; margin-bottom: 14px; color: var(--ink-2); font: 12px var(--mono); text-decoration: none; }
.backlink:hover { color: var(--ink); }
.obs { background: var(--card); border: 1px solid var(--hair); border-radius: 16px; padding: 16px 20px; margin-bottom: 12px; }
.obs .obs-head { font: 600 16px var(--serif); }
.obs .obs-meta { margin-top: 6px; font: 11px var(--mono); color: var(--ink-3); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }

/* ————— hero tiles ————— */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 10px; margin-top: 20px; }
.tile { background: var(--card); border: 1px solid var(--hair); border-radius: 14px; padding: 13px 14px 11px; text-align: left; color: var(--ink); font: inherit; }
button.tile { cursor: pointer; }
button.tile:hover { border-color: var(--pod); }
.tile .v { font: 600 20px var(--mono); letter-spacing: -0.01em; margin-top: 5px; }
.tile .d { color: var(--ink-3); font: 10.5px var(--mono); margin-top: 4px; line-height: 1.6; }
.tile .go { color: var(--pod-deep); font: 10.5px var(--mono); margin-top: 4px; }

/* ————— waveform: the session drawn as its rhythm of turns ————— */
.wavebox { margin-top: 14px; background: var(--card); border: 1px solid var(--hair); border-radius: 10px; padding: 14px 14px 8px; }
.wavescroll { overflow-x: auto; }
.wave-legend { display: flex; gap: 16px; padding: 8px 2px 4px; color: var(--ink-3); font: 10.5px var(--mono); flex-wrap: wrap; }
.wave-legend i { font-style: normal; }
.wave-legend .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }
.wbar { transform-origin: bottom; }
@media (prefers-reduced-motion: no-preference) {
  .wbar { animation: rise 0.35s cubic-bezier(.2,.7,.3,1) backwards; }
  @keyframes rise { from { transform: scaleY(0); } }
}
.tooltip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--paper); border-radius: 8px; padding: 8px 10px; font: 11px var(--mono); max-width: 320px; display: none; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.tooltip .tp { opacity: .75; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 3px; font-family: var(--sans); }

/* ————— "how Claude worked": compact flow graph + click-to-open detail ————— */
.fgraph { display: flex; flex-wrap: wrap; gap: 6px 4px; align-items: stretch; margin-top: 12px; }
.farrow { align-self: center; color: var(--ink-3); font: 13px var(--mono); padding: 0 3px; }
.fnode { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; text-align: left; background: var(--card); border: 1px solid var(--hair); border-radius: 14px; padding: 8px 11px; cursor: pointer; color: var(--ink); font: inherit; max-width: 210px; }
.fnode:hover { border-color: var(--pod); }
.fnode.active { border-color: var(--pod); background: var(--pod-tint); }
.fnode .fl { font: 600 12.5px var(--sans); line-height: 1.3; display: flex; align-items: center; gap: 6px; }
.fnode .fl .fdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.fnode .fs { font: 10.5px var(--mono); color: var(--ink-3); }
.fnode .fb { font: 10px var(--mono); color: var(--major); }
.fnode .fb.warn { color: var(--moderate); }
.flow-hint { margin-top: 10px; color: var(--ink-3); font: 11px var(--mono); }
.phase { background: var(--card); border: 1px solid var(--hair); border-radius: 16px; margin-top: 10px; padding: 12px 15px; }
.phase .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
.phase .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.phase .plabel { font-weight: 650; font-size: 14.5px; }
.phase .pgloss { color: var(--ink-3); font-size: 12px; }
.phase .pstats { margin-left: auto; font: 11px var(--mono); color: var(--ink-2); white-space: nowrap; }
.phase .pfiles { margin-top: 5px; font: 11.5px var(--mono); color: var(--ink-2); }
.phase .pchips { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { cursor: pointer; font: 11px var(--mono); border: 1px solid var(--hair); border-radius: 6px; padding: 3px 9px; background: var(--paper); color: var(--ink-2); }
.pchip:hover { border-color: var(--pod); color: var(--ink); }
.pchip.agent { background: var(--pod-tint); border-color: transparent; color: var(--pod-deep); }
.pchip.warn { background: var(--moderate-tint); border-color: transparent; color: var(--moderate); }
.pchip.err { background: var(--major-tint); border-color: transparent; color: var(--major); }
.phase .pline { margin-top: 6px; font: 11.5px var(--mono); color: var(--ink-3); }
.phase details { margin-top: 8px; border-top: 1px dashed var(--hair-2); }
.phase summary { cursor: pointer; list-style: none; color: var(--ink-3); font: 11px var(--mono); padding-top: 7px; }
.phase summary::before { content: "▸ "; }
.phase details[open] summary::before { content: "▾ "; }
.turnrow { padding: 7px 0 6px 10px; border-left: 2px solid var(--hair-2); margin-top: 7px; }
.turnrow .who { font: 600 9.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.turnrow .prompt { font-size: 12.5px; margin-top: 1px; max-width: 76ch; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.turnrow .did { margin-top: 3px; font: 11px var(--mono); color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 5px 12px; }
.turnrow .did .err { color: var(--major); }
.turnrow .did .agent { color: var(--pod-deep); }

/* ————— agents & tables ————— */
table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.data th { text-align: left; font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--hair); }
table.data td { padding: 8px 10px; border-bottom: 1px solid var(--hair-2); vertical-align: top; }
table.data td.mono, table.data th.num { font: 12px var(--mono); }
table.data th.num, table.data td.num { text-align: right; font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.callbar { display: inline-block; height: 6px; background: var(--bar); border-radius: 3px; vertical-align: 1px; margin-right: 8px; }

/* ————— findings ————— */
.finding { background: var(--card); border: 1px solid var(--hair); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
.f-head { display: flex; align-items: flex-start; gap: 10px; padding: 13px 14px 0; }
.badge { font: 700 9.5px var(--mono); letter-spacing: 0.08em; border-radius: 5px; padding: 3px 7px; flex: none; margin-top: 2px; }
.badge.major { color: var(--major); background: var(--major-tint); }
.badge.moderate { color: var(--moderate); background: var(--moderate-tint); }
.badge.minor { color: var(--minor); background: var(--minor-tint); }
.badge.info { color: var(--info); background: var(--info-tint); }
.f-title { font-weight: 600; font-size: 14px; flex: 1; }
.f-rule { color: var(--ink-3); font: 10.5px var(--mono); white-space: nowrap; margin-top: 3px; }
.f-body { padding: 6px 14px 13px 14px; }
.f-desc { color: var(--ink-2); font-size: 13px; max-width: 72ch; }
.f-line { margin-top: 9px; font: 12px var(--mono); display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.f-line .k { color: var(--ink-3); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; }
.tag { font: 600 9.5px var(--mono); letter-spacing: .06em; border-radius: 4px; padding: 2px 6px; }
.tag.measured { color: var(--pod-deep); background: var(--pod-tint); }
.tag.modeled { color: var(--moderate); border: 1px solid var(--moderate); }
.tag.avail { color: var(--pod-deep); background: var(--pod-tint); }
.method { color: var(--ink-3); font: 11px var(--sans); font-style: italic; }
.f-fix .ref { color: var(--ink); font-weight: 600; }
.f-fix .why { color: var(--ink-2); font-family: var(--sans); }
details.evidence { border-top: 1px solid var(--hair-2); margin-top: 11px; }
details.evidence summary { cursor: pointer; padding: 8px 0 0; color: var(--ink-2); font: 11px var(--mono); list-style: none; }
details.evidence summary::before { content: "▸ "; }
details[open].evidence summary::before { content: "▾ "; }
.ev { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px dashed var(--hair-2); font: 11px var(--mono); }
.ev:last-child { border-bottom: 0; }
.ev .kind { color: var(--ink-3); flex: none; width: 118px; }
.ev .snip { color: var(--ink-2); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .loc { color: var(--ink-3); flex: none; }
.fb { display: flex; gap: 10px; flex: none; align-items: center; }
.fbq { display: flex; gap: 3px; align-items: center; font: 10px var(--mono); color: var(--ink-3); }
.fb button { font: 11px var(--mono); border: 1px solid var(--hair); background: none; color: var(--ink-2); border-radius: 6px; padding: 2px 7px; cursor: pointer; }
.fb button:hover { border-color: var(--ink-3); color: var(--ink); }
.fb button.on-yes { background: var(--pod-tint); border-color: var(--pod); color: var(--pod-deep); }
.fb button.on-no { background: var(--major-tint); border-color: var(--major); color: var(--major); }
.empty { background: var(--card); border: 1px dashed var(--hair); border-radius: 10px; padding: 18px; color: var(--ink-2); font-size: 13px; }
.empty b { color: var(--pod-deep); }
.infra-note { color: var(--ink-2); font-size: 12px; margin: -6px 0 12px; max-width: 72ch; }

/* ————— skills profile ————— */
.skillgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.skill { background: var(--card); border: 1px solid var(--hair); border-radius: 10px; padding: 14px; }
.skill h3 { font: 600 14px var(--sans); margin: 0 0 2px; }
.skill .tagline { color: var(--ink-3); font-size: 12px; }
.state { display: inline-block; font: 600 9.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; border-radius: 5px; padding: 3px 7px; margin: 8px 0 6px; }
.state.practiced_well { color: var(--pod-deep); background: var(--pod-tint); }
.state.opportunities_missed { color: var(--moderate); background: var(--moderate-tint); }
.state.not_needed { color: var(--ink-3); background: var(--hair-2); }
.state.getting_started { color: var(--minor); background: var(--minor-tint); }
.skill .rate { font: 12px var(--mono); color: var(--ink-2); }
.skill .waste { font: 11.5px var(--mono); color: var(--moderate); margin-top: 3px; }
.skill .next { margin-top: 9px; font-size: 12px; color: var(--ink-2); border-top: 1px dashed var(--hair-2); padding-top: 8px; }
.skill .next b { color: var(--ink); font-weight: 600; }
.skill details { margin-top: 8px; }
.skill summary { cursor: pointer; color: var(--ink-3); font: 11px var(--mono); list-style: none; }
.skill summary::before { content: "▸ "; }
.skill details[open] summary::before { content: "▾ "; }
.skill .note { margin-top: 8px; color: var(--ink-3); font-size: 11px; font-style: italic; }
.rec { background: var(--card); border: 1px solid var(--hair); border-left: 3px solid var(--moderate); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.rec .h { font-size: 13.5px; }
.rec .t { margin-top: 5px; font-size: 12.5px; color: var(--ink-2); }
.rec .t b { color: var(--ink); }
.fb-dismiss { float: right; font: 10.5px var(--mono); border: 1px solid var(--hair); background: none; color: var(--ink-3); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
.fb-dismiss:hover { border-color: var(--major); color: var(--major); }
/* recommendation rows: one hitting line; click → dialog */
.recrow { background: var(--card); border: 1px solid var(--hair); border-left: 3px solid var(--moderate); border-radius: 14px; margin-bottom: 8px; padding: 13px 15px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; cursor: pointer; }
.recrow:hover { border-color: var(--pod); border-left-color: var(--pod); }
.recrow .rc-head { font: 600 14.5px/1.4 var(--sans); flex: 1; min-width: 200px; }
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; display: none; align-items: flex-start; justify-content: center; padding: 6vh 16px; }
.modal-back.open { display: flex; }
.modal { background: var(--card); border: 1px solid var(--hair); border-radius: 18px; max-width: 680px; width: 100%; max-height: 84vh; overflow-y: auto; padding: 20px 22px; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
.modal .m-head { font: 600 21px/1.3 var(--serif); letter-spacing: -0.005em; padding-right: 30px; }
.modal .m-close { float: right; background: none; border: 1px solid var(--hair); border-radius: 6px; color: var(--ink-3); font: 13px var(--mono); padding: 2px 9px; cursor: pointer; }
.modal .m-close:hover { color: var(--ink); border-color: var(--ink-3); }
.rc-label { font: 600 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 12px 0 5px; }
.rc-text { font-size: 13px; color: var(--ink-2); max-width: 76ch; }
.rc-steps ol { margin: 4px 0 0; padding-left: 20px; font-size: 12.5px; color: var(--ink-2); max-width: 74ch; }
.rc-steps li { margin-top: 4px; }
.rc-prov { margin-top: 8px; font: 10.5px var(--mono); color: var(--ink-3); display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.rc-instances { margin-top: 12px; }
.m-instances { margin-top: 10px; }
.m-instances .finding { border-color: var(--hair-2); }
.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0% { outline: 2px solid var(--pod); outline-offset: 2px; } 100% { outline: 2px solid transparent; } }

/* ————— inventory & rules ————— */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 11px var(--mono); border-radius: 6px; padding: 3px 9px; border: 1px solid var(--hair); color: var(--ink-3); }
.chip.used { background: var(--pod-tint); border-color: transparent; color: var(--pod-deep); }
.inv-label { font: 10px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); margin: 14px 0 7px; }
table.rules { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.rules th { text-align: left; font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--hair); }
table.rules td { padding: 9px 10px; border-bottom: 1px solid var(--hair-2); vertical-align: top; }
table.rules td.mono { font: 12px var(--mono); white-space: nowrap; }
.precision-bar { width: 90px; height: 6px; background: var(--hair); border-radius: 3px; overflow: hidden; }
.precision-bar i { display: block; height: 100%; background: var(--pod); }
.loading { color: var(--ink-3); font: 12px var(--mono); padding: 60px 0; text-align: center; }
/* how-to recipes + library */
.howto-body { padding: 8px 0 4px; font-size: 12.5px; color: var(--ink-2); max-width: 74ch; }
.howto-body .hb-what { margin-bottom: 6px; }
.howto-body ol { margin: 0; padding-left: 20px; }
.howto-body li { margin-top: 3px; }
.howto-body .hb-notes { margin-top: 7px; font-style: italic; color: var(--ink-3); font-size: 11.5px; }
.howto-body .hb-prov { margin-top: 8px; font: 10.5px var(--mono); color: var(--ink-3); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.libgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.libcard { background: var(--card); border: 1px solid var(--hair); border-radius: 14px; padding: 13px 15px; }
.libcard h3 { font: 600 13.5px var(--sans); margin: 0; }
.libcard .lk { font: 600 9px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--minor); background: var(--minor-tint); border-radius: 4px; padding: 2px 6px; margin-left: 7px; vertical-align: 1px; }
.libcard .lw { color: var(--ink-2); font-size: 12.5px; margin-top: 5px; }
.libcard details { margin-top: 7px; }
.libcard summary { cursor: pointer; list-style: none; color: var(--ink-3); font: 11px var(--mono); }
.libcard summary::before { content: "▸ "; }
.libcard details[open] summary::before { content: "▾ "; }
.grading { margin-top: 40px; border-top: 1px solid var(--hair); padding-top: 10px; color: var(--ink-3); font: 10.5px var(--mono); }
button:focus-visible, .sess:focus-visible, summary:focus-visible, [role="button"]:focus-visible, .skip:focus-visible { outline: 2px solid var(--pod); outline-offset: 2px; }
/* Vercel web-interface-guidelines pass */
body { -webkit-tap-highlight-color: transparent; }
button, [role="button"], summary, .sess, .tile { touch-action: manipulation; }
h1, .briefbox .big { text-wrap: balance; }
.tile .v, .fnode .fs, .pstats, table.data td.num, table.rules td.mono, .tag.measured { font-variant-numeric: tabular-nums; }
.modal, .side, .sessions { overscroll-behavior: contain; }
.turnrow { content-visibility: auto; contain-intrinsic-size: 64px; }
.skip { position: absolute; left: -9999px; top: 8px; z-index: 50; background: var(--card); color: var(--ink); border: 1px solid var(--pod); border-radius: 8px; padding: 8px 14px; font: 12px var(--mono); }
.skip:focus { left: 8px; }
h2.eyebrow { font-size: 10px; }
@media (prefers-reduced-motion: no-preference) {
  .wrap > * { animation: fadeup .38s cubic-bezier(.2,.7,.3,1) backwards; }
  .wrap > *:nth-child(2) { animation-delay: 40ms; }
  .wrap > *:nth-child(3) { animation-delay: 80ms; }
  .wrap > *:nth-child(4) { animation-delay: 120ms; }
  .wrap > *:nth-child(5) { animation-delay: 160ms; }
  .wrap > *:nth-child(6) { animation-delay: 200ms; }
  .wrap > *:nth-child(n+7) { animation-delay: 240ms; }
  @keyframes fadeup { from { opacity: 0; transform: translateY(8px); } }
}
@media (prefers-reduced-motion: reduce) {
  .flash { animation: none; outline: 2px solid var(--pod); outline-offset: 2px; }
  .side { transition: none; }
}
/* ————— Sprint C port: clay hero · what-now · ledger (tokens keep every theme working) ————— */
.hero { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 48px; padding: 26px 0 34px; border-bottom: 1px solid var(--hair); align-items: start; }
.h-eyebrow { font: 500 12px var(--mono); color: var(--ink-2); letter-spacing: .08em; }
.session-name { font: 500 clamp(30px, 4.6vw, 42px)/1.14 var(--serif); letter-spacing: -.012em; margin-top: 8px; text-wrap: balance; }
.hero .briefbox { margin-top: 14px; min-height: 64px; }
.hero .briefbox .big { font: italic 500 17.5px/1.6 var(--serif); color: var(--ink-2); max-width: 36em; letter-spacing: 0; }
.hstats { margin-top: 20px; font: 12.5px/1.9 var(--mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.hstats b { color: var(--ink-2); font-weight: 500; }
.hstats .sep { color: var(--hair); padding: 0 6px; }
.scoreblock { display: block; padding-top: 2px; text-decoration: none; color: var(--ink); }
.score-line2 { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
.score-num { font: 350 clamp(64px, 9vw, 92px)/1 var(--serif); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.score-of { font: 400 18px var(--serif); color: var(--ink-3); }
.params { margin-top: 16px; display: grid; gap: 10px; }
.param { display: grid; grid-template-columns: 1fr 34px; gap: 8px 10px; align-items: center; }
.param .plabel { font-size: 12.5px; color: var(--ink-2); line-height: 1.3; }
.param .pnum { font: 12.5px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.param .track { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--bar-notif); overflow: hidden; }
.param .fill { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--pod), var(--pod-deep)); min-width: 2px; }
.param.zero .fill { background: transparent; }
.params-note { margin-top: 12px; font-size: 11.5px; color: var(--ink-3); }
.scoreblock:hover .params-note { color: var(--pod-deep); }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; gap: 28px; } .scoreblock { border-top: 1px solid var(--hair); padding-top: 22px; } }

.whatnow { padding: 30px 0 6px; }
.wn-head { font: 500 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.wn-row { display: flex; align-items: baseline; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--hair-2); }
.wn-ic { color: var(--pod-deep); font-size: 15px; width: 20px; flex: none; text-align: center; }
.wn-text { flex: 1; font-size: 15.5px; line-height: 1.55; max-width: 52em; }
.wn-act { flex: none; font: 500 13px var(--sans); color: var(--pod-deep); text-decoration: none; border: 1px solid var(--hair); border-radius: 999px; padding: 7px 14px; background: var(--card); white-space: nowrap; }
.wn-act:hover { border-color: var(--pod); background: var(--pod-tint); }

<body>
<div class="progress" id="progress" aria-hidden="true"><i></i></div>
<a class="skip" href="#view">Skip to content</a>
<button class="menu-btn" id="menuBtn">☰ sessions</button>
<div class="app">
  <nav class="side">
    <div class="brand" translate="no"><b>damame</b><span>session profiler</span></div>
    <div class="sessions" id="sessions"></div>
    <div class="side-foot">
      <div class="foot-label">more</div>
      <button class="navbtn" id="libraryBtn">library</button>
      <button class="navbtn" id="overviewBtn">your skills</button>
      <button class="navbtn" id="rulesBtn">rules &amp; precision</button>
      <button class="navbtn" id="evalBtn">eval &amp; ground truth</button>
      <div class="local-note">local only — nothing leaves this machine</div>
    </div>
  </nav>
  <main class="main"><div class="wrap" id="view"><div class="loading">reading sessions…</div></div></main>
</div>
<div class="tooltip" id="tip"></div>
<div class="info-pop" id="infoPop" role="note" aria-live="polite"></div>
<div class="modal-back" id="modalBack"><div class="modal" id="recModal" role="dialog" aria-modal="true" aria-labelledby="recModalHead"></div></div>
<div class="themes" id="themes" role="group" aria-label="Theme picker"></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTok = (n) => n >= 1e9 ? (n/1e9).toFixed(1)+"B" : n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n);
const fmtMs = (ms) => ms >= 864e5 ? (ms/864e5).toFixed(1)+"d" : ms >= 36e5 ? (ms/36e5).toFixed(1)+"h" : ms >= 6e4 ? (ms/6e4).toFixed(1)+"m" : (ms/1e3).toFixed(1)+"s";
const DATE_FMT = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", year: "numeric" });
const fmtDate = (iso) => iso ? DATE_FMT.format(new Date(iso)) : "?";
const fmtSize = (b) => b >= 1e6 ? (b/1e6).toFixed(0)+"MB" : (b/1e3).toFixed(0)+"KB";

const state = { sessions: [], currentId: null, data: null, view: "session", registry: [], noActionRefs: [] };

/** Plain-language one-liners for the score parameters. */
const BUCKET_DESC = {
  "cost-efficiency": "How much of the session's fresh work was wasted — measured tokens on re-work vs everything produced.",
  "context-hygiene": "How well the chat's memory was managed — cache misses, compactions, oversized reads, eternal chats.",
  "redundant-work": "Repeats that bought nothing — identical calls re-run, the same data hand-entered again and again.",
  "missed-capabilities": "Machinery that would have helped and sat unused — delegation, saved workflows, hooks, notifications.",
  "prompting-recovery": "How failures and direction changes were handled — error loops, rewound work, permission churn.",
};

/* Rough public API prices per MTok [pattern, input$, output$]; cache reads
   bill at ~0.1× input, cache writes at ~1.25×. Estimate only — subscription
   sessions never bill per token. */
const PRICES = [[/fable|mythos/, 10, 50], [/opus/, 5, 25], [/sonnet/, 3, 15], [/haiku/, 1, 5]];
function estCost(perModel) {
  let usd = 0, known = false;
  for (const m of perModel || []) {
    const p = PRICES.find(([re]) => re.test(m.model));
    if (!p) continue;
    known = true;
    const u = m.usage || {};
    usd += ((u.input_tokens || 0) * p[1] + (u.output_tokens || 0) * p[2]
      + (u.cache_read_input_tokens || 0) * p[1] * 0.1
      + (u.cache_creation_input_tokens || 0) * p[1] * 1.25) / 1e6;
  }
  return known ? usd : null;
}

/* ————— themes ————— */
const THEMES = [
  { id: "clay", label: "clay", bg: "linear-gradient(135deg,#F0EFE9 60%,#CC785C 60%)" },
  { id: "slate", label: "slate", bg: "linear-gradient(135deg,#1F1E1D 60%,#D97757 60%)" },
  { id: "auto", label: "auto (system)", bg: "linear-gradient(135deg,#FAFAF7 50%,#141815 50%)" },
  { id: "paper", label: "paper", bg: "linear-gradient(135deg,#FAFAF7 60%,#5B8C3E 60%)" },
  { id: "midnight", label: "midnight", bg: "linear-gradient(135deg,#141815 60%,#8FBF6A 60%)" },
  { id: "ocean", label: "ocean", bg: "linear-gradient(135deg,#0C141D 60%,#38BDF8 60%)" },
  { id: "forest", label: "forest", bg: "linear-gradient(135deg,#0F1511 60%,#A3E635 60%)" },
  { id: "sunset", label: "sunset", bg: "linear-gradient(135deg,#FFF8F2 60%,#E0632D 60%)" },
  { id: "violet", label: "violet", bg: "linear-gradient(135deg,#12101C 60%,#A78BFA 60%)" },
];
function applyTheme(id) {
  if (id === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = id;
  try { localStorage.setItem("damame-theme", id); } catch { /* private mode */ }
  for (const b of document.querySelectorAll(".tdot")) b.classList.toggle("active", b.dataset.t === id);
}
function initThemes() {
  $("themes").innerHTML = THEMES.map((t) =>
    `<button class="tdot" data-t="${t.id}" title="${esc(t.label)}" aria-label="Theme: ${esc(t.label)}" style="background:${t.bg}"></button>`).join("");
  for (const b of document.querySelectorAll(".tdot")) b.onclick = () => applyTheme(b.dataset.t);
  let saved = "clay";
  try { saved = localStorage.getItem("damame-theme") || "clay"; } catch { /* ignore */ }
  applyTheme(saved);
}

/* ————— global progress bar ————— */
let progressCount = 0;
const progressStart = () => { progressCount++; $("progress").classList.add("on"); };
const progressDone = () => { progressCount = Math.max(0, progressCount - 1); if (!progressCount) $("progress").classList.remove("on"); };

/** Resolve a recommendation (kind + ref) to a shelf recipe, with fallbacks. */
function registryEntryFor(kind, ref) {
  const byId = state._regById || (state._regById = new Map(state.registry.map((e) => [e.id, e])));
  const direct = byId.get(ref);
  if (direct) return direct;
  if (kind === "subagent") return byId.get("subagent-" + String(ref).toLowerCase()) || byId.get("custom-subagents");
  if (kind === "skill") return byId.get("skill-" + String(ref).toLowerCase()) || byId.get("using-skills");
  return undefined;
}

function howToBlock(entry) {
  if (!entry) return "";
  return `
    <details class="evidence howto"><summary>how to do this — ${esc(entry.title)}</summary>
      <div class="howto-body">
        <div class="hb-what">${esc(entry.what_it_is)}</div>
        <ol>${entry.how_to.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>
        ${entry.notes ? `<div class="hb-notes">${esc(entry.notes)}</div>` : ""}
        <div class="hb-prov"><span class="tag ${entry.status === "verified" ? "measured" : "modeled"}">${esc(entry.status)}</span> <span>source: ${esc(entry.source)}</span>${entry.verified_by ? `<span> · ${esc(entry.verified_by)}</span>` : ""}</div>
      </div>
    </details>`;
}

async function api(path, opts) {
  progressStart();
  try {
    const res = await fetch(path, opts);
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    return await res.json();
  } finally {
    progressDone();
  }
}

async function boot() {
  const [sessions, registry] = await Promise.all([api("/api/sessions"), api("/api/registry").catch(() => null)]);
  state.sessions = sessions;
  if (registry) { state.registry = registry.entries; state.noActionRefs = registry.no_action_refs; }
  renderSidebar();
  route();
  window.addEventListener("hashchange", route);
}

/** URL = state: #<sid8>[/page] | #library | #skills | #rules */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === "library") return showLibrary();
  if (h === "skills") return showOverview();
  if (h === "rules") return showRules();
  if (h === "eval") return showEval();
  const [sid, page] = h.split("/");
  const target = sid && state.sessions.find((s) => s.id.startsWith(sid));
  if (target) return selectSession(target.id, page || null);
  if (state.sessions.length) return selectSession(state.sessions[0].id, null);
  $("view").innerHTML = '<div class="empty">No Claude Code sessions found under ~/.claude/projects. Work a session, then reopen damame.</div>';
}

const setHash = (h) => { if (location.hash.slice(1) !== h) history.replaceState(null, "", "#" + h); };

function renderSidebar() {
  $("sessions").innerHTML = state.sessions.map((s) => `
    <button class="sess ${s.id === state.currentId && state.view === "session" ? "active" : ""}" data-id="${esc(s.id)}">
      <div class="m" style="margin:0 0 2px;color:var(--pod-deep)">${esc((s.project || "").split("/").pop() || "?")}</div>
      <div class="t">${esc(s.title || s.id.slice(0, 8))}</div>
      <div class="m">${esc(fmtDate(s.modified_at))} · ${esc(fmtSize(s.size_bytes))} · ${esc(s.id.slice(0, 8))}</div>
    </button>`).join("");
  for (const el of document.querySelectorAll(".sess")) el.onclick = () => selectSession(el.dataset.id);
  $("rulesBtn").classList.toggle("active", state.view === "rules");
  $("evalBtn").classList.toggle("active", state.view === "eval");
  $("overviewBtn").classList.toggle("active", state.view === "overview");
  $("libraryBtn").classList.toggle("active", state.view === "library");
}

const closeSide = () => document.querySelector(".side").classList.remove("open");

async function selectSession(id, page = null) {
  state.view = "session"; state.page = page; renderSidebar(); closeSide();
  setHash(id.slice(0, 8) + (page ? "/" + page : ""));
  state.currentId = id;
  if (state.data && state.data.meta.id === id) { renderSession(state.data); return; }
  const s = state.sessions.find((x) => x.id === id);
  $("view").innerHTML = `<div class="loading">reading ${esc(fmtSize(s?.size_bytes ?? 0))} transcript…</div>`;
  try {
    state.data = await api("/api/session/" + id);
    if (state.currentId !== id) return;
    renderSession(state.data);
  } catch (e) {
    $("view").innerHTML = `<div class="empty">Could not analyze this session: ${esc(e.message)}</div>`;
  }
}

/* ————— shared recommendation-item helpers ————— */
const sumMetric = (it, key) => it.findings.reduce((acc, f) => acc + (Number(f.evidence?.metrics?.[key]) || 0), 0);
function headlineFor(it) {
  const m0 = it.findings[0]?.evidence?.metrics || {};
  switch (it.rule_id) {
    case "paste-relay": return `You entered ~${sumMetric(it, "occurrences")} similar blocks by hand — this could be automated`;
    case "cache-thrash": return `${fmtTok(it.tokens)} tokens were re-billed by avoidable cache misses`;
    case "eternal-session": return `One chat ran ${m0.span_days ? Math.round(m0.span_days) + " days" : "for weeks"} with ${m0.compactions ?? "repeated"} memory wipes — fresh chats would be cheaper`;
    case "compaction-burn": return `${m0.compaction_count ?? "Repeated"} compactions paused the work${it.ms ? " for " + fmtMs(it.ms) : ""} — keep bulk out of the chat`;
    case "idle-gap-notifications": return `Finished work sat waiting ${m0.gap_count ?? "many"} times — notifications would ping you instead`;
    case "repeated-delegation": return `The same helper task was re-written ${sumMetric(it, "occurrences")} times — save it as one command`;
    case "abandoned-work": return `${fmtTok(it.tokens)} tokens ended up on abandoned branches`;
    case "duplicate-tool-call": return `Identical calls re-run for ~${fmtTok(it.tokens)} tokens of already-seen output`;
    case "oversized-context-reads": return `Whole huge files were loaded into the chat — targeted reads would cost a fraction`;
    case "missed-delegation": return `Bulk exploring happened by hand while helper agents sat unused`;
    case "edit-fail-loop": return `The same edit kept failing — a re-read would have broken the loop`;
    case "bash-error-loop": return `The same command kept failing unchanged — diagnose, then retry`;
    case "permission-churn": return `Repeated permission prompts interrupted the flow — allowlist the safe ones`;
    case "post-edit-ritual": return `The same check followed your edits ${sumMetric(it, "occurrences")} times — a hook could run it for you`;
    default: return it.title;
  }
}
function cost(it) {
  return [it.tokens ? "~" + fmtTok(it.tokens) + " tok" : null, it.ms ? fmtMs(it.ms) : null].filter(Boolean).join(" · ");
}
function recipeBody(entry) {
  return entry ? `
    <div class="rc-label">how to fix it${entry.title ? ` — ${esc(entry.title)}` : ""}</div>
    <div class="rc-text">${esc(entry.what_it_is)}</div>
    <div class="rc-steps"><ol>${entry.how_to.map((x) => `<li>${esc(x)}</li>`).join("")}</ol></div>
    ${entry.notes ? `<div class="rc-text" style="margin-top:6px;font-style:italic;color:var(--ink-3)">${esc(entry.notes)}</div>` : ""}
    <div class="rc-prov"><span class="tag ${entry.status === "verified" ? "measured" : "modeled"}">${esc(entry.status)}</span><span>source: ${esc(entry.source)}</span></div>` : "";
}

/* ————— the five observation sections ————— */

  { id: "redundant", title: "Redundant work", gloss: "work that repeated without producing anything new", rules: ["duplicate-tool-call", "paste-relay", "abandoned-work"] },
  { id: "time", title: "Time & manual grind", gloss: "waiting and hand-work that machinery could carry", rules: ["idle-gap-notifications", "post-edit-ritual", "repeated-delegation", "missed-delegation", "edit-fail-loop", "bash-error-loop", "permission-churn"] },
];
const RULE_CONCEPTS = {
  "cache-thrash": ["concept:caching"],
  "compaction-burn": ["concept:compaction"],
  "eternal-session": ["concept:compaction"],
  "repeated-delegation": ["Workflow"],
  "missed-delegation": ["concept:agents"],
  "post-edit-ritual": ["concept:hooks"],
  "idle-gap-notifications": [],
};

function sessionHeader(d, back) {
  return `
    ${back ? `<a class="backlink" href="#${esc(d.meta.id.slice(0, 8))}">← back to session</a>` : ""}
    <span class="eyebrow">${esc(d.meta.project || "session")}</span>
    <h1>${esc(d.meta.title)}</h1>
    <div class="sub">${esc(fmtDate(d.meta.started_at))} → ${esc(fmtDate(d.meta.ended_at))} · CLI ${esc(d.meta.versions.filter(Boolean).join("–") || "?")}</div>`;
}

function renderSession(d) {
  state.items = buildRecItems(d, state.pbMatch || null, state.recurrence || {});
  if (state.page) renderDetail(d, state.page);
  else renderHome(d);
}

function sessionHero(d) {
  const f = d.facts;
  const u = f.usage || {};
  const fresh = (u.input_tokens ?? 0) + (u.output_tokens ?? 0) + (u.cache_creation_tokens ?? 0);
  const days = d.meta.started_at && d.meta.ended_at
    ? Math.max(1, Math.round((Date.parse(d.meta.ended_at) - Date.parse(d.meta.started_at)) / 86400000))
    : null;
  const agents = (d.agents || []).filter((a) => !a.on_abandoned_branch).length;
  const sep = '<span class="sep">·</span>';
  const params = (d.score?.buckets || []).map((b) => `
      <div class="param${b.score === 0 ? " zero" : ""}" role="listitem">
        <span class="plabel">${esc(b.label)}</span><span class="pnum">${b.score}</span>
        <span class="track"><span class="fill" style="width:${b.score}%"></span></span>
      </div>`).join("");
  return `
    <section class="hero" aria-label="Session identity and score">
      <div>
        <p class="h-eyebrow">${esc(d.meta.project || "session")}${days !== null ? ` ${sep} ${esc(fmtDate(d.meta.started_at))} → ${esc(fmtDate(d.meta.ended_at))} ${sep} ${days} day${days === 1 ? "" : "s"}` : ""}</p>
        <h1 class="session-name">${esc(d.meta.title)}</h1>
        <div class="briefbox" id="briefbox"><span class="muted">✦ reading this session's story… first open takes a moment; cached after</span><div class="mini-progress"><i></i></div></div>
      </div>
      ${d.score ? `
      <a class="scoreblock" href="#${d.meta.id.slice(0, 8)}/score" aria-label="Session score ${d.score.overall} out of 100 — how it's computed">
        <p class="h-eyebrow">Session score</p>
        <p class="score-line2"><span class="score-num">${d.score.overall}</span><span class="score-of">/ 100</span></p>
        <div class="params" role="list" aria-label="Score parameters">${params}</div>
        <p class="params-note">Five parameters. Infra weather never counts here. How it's computed →</p>
      </a>` : ""}
    </section>`;
}

/** The vitals band: Tokens + Est. cost as the two large anchors, then the
    activity/behavior numbers. */
function statsBand(d) {
  const f = d.facts;
  const u = f.usage || {};
  const fresh = (u.input_tokens ?? 0) + (u.output_tokens ?? 0) + (u.cache_creation_tokens ?? 0);
  const usd = estCost(d.per_model);
  const agents = (d.agents || []).filter((a) => !a.on_abandoned_branch).length;
  const days = d.meta.started_at && d.meta.ended_at
    ? Math.max(1, Math.round((Date.parse(d.meta.ended_at) - Date.parse(d.meta.started_at)) / 86400000)) : null;
  const tile = (sv, sl, big) => `<div class="stat${big ? " big" : ""}"><span class="sv">${sv}</span><span class="sl">${sl}</span></div>`;
  return `<section class="statsband" aria-label="session vitals">
    ${tile(`<em>${fmtTok(f.total_tokens)}</em>`, `tokens · ${fmtTok(fresh)} fresh`, true)}
    ${tile(usd !== null ? `<em>$${usd.toFixed(2)}</em>` : "—", "estimated cost", true)}
    ${tile(f.turn_count.toLocaleString(), `turns · ${f.human_turn_count.toLocaleString()} yours`)}
    ${tile(f.tool_call_count.toLocaleString(), "tool calls")}
    ${tile(String(agents), "subagent runs")}
    ${tile(String(f.compactions), "compactions")}
    ${days !== null ? tile(String(days), days === 1 ? "day" : "days") : ""}
  </section>`;
}

/** Section cards → depth. Issues is the primary flow (issues → fix → fixed);
    the rest are the profiler's depth views. */
function renderHome(d) {
  const sid = d.meta.id.slice(0, 8);
  const items = state.items || [];
